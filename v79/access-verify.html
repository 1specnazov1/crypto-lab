<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://txhzxbizjpinowepfjkm.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>CRYPTO LAB · Проверка доступа</title>
<style>
:root{--b:#0b0e11;--p:#151a21;--l:#2b3139;--t:#eaecef;--m:#848e9c;--g:#f0b90b;--ok:#0ecb81;--bad:#f6465d}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--b);color:var(--t);font:13px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:var(--p);border:1px solid var(--l);border-radius:16px;padding:26px;box-shadow:0 26px 80px #000a}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.logo{width:42px;height:42px;border-radius:11px;background:var(--g);color:#111;display:grid;place-items:center;font-weight:1000}.brand b{letter-spacing:.08em}.brand small{display:block;color:var(--m);margin-top:2px}.state{border:1px solid var(--l);border-radius:10px;background:#10151b;padding:13px 14px;line-height:1.55}.state.ok{border-color:#0ecb8144;background:#0ecb8110;color:#b9f4d9}.state.bad{border-color:#f6465d44;background:#f6465d10;color:#ffc4cd}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #66717e;border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}button{width:100%;margin-top:12px;border:1px solid #f0b90b55;background:#f0b90b10;color:#ffe58f;border-radius:9px;padding:11px;font:inherit;font-weight:800;cursor:pointer}.note{margin-top:12px;color:var(--m);font-size:10px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">₿</div><div><b>CRYPTO LAB</b><small>v79 · EMAIL ACCESS</small></div></div>
  <h1 style="font-size:23px;margin:0 0 14px">Проверка доступа</h1>
  <div id="state" class="state"><span class="spinner"></span>Проверяю персональную ссылку и этот браузер…</div>
  <button id="retry" type="button" hidden>Запросить новую ссылку</button>
  <div class="note">Защита CRYPTO LAB: ссылка работает только в браузере, где был введён email. Пересланная ссылка на другом устройстве не создаёт сессию.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./access-verify.js"></script>
</body>
</html>
