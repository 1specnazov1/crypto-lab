<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e11">
<title>CRYPTO LAB v79 · Backtest</title>
<style>
:root{--b:#0b0e11;--p:#151a21;--p2:#1e2329;--l:#2b3139;--t:#eaecef;--m:#98a2b3;--g:#f0b90b;--ok:#0ecb81;--bad:#f6465d;--blue:#4d9fff}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--b);color:var(--t);font:13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:54px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#101317;border-bottom:1px solid var(--l)}.brand{font-weight:950}.brand span{color:var(--g)}.tabs{display:flex;gap:6px;margin-left:12px}.tabs button{background:var(--p2);border:1px solid var(--l);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}.tabs button.on{border-color:#f0b90b88;background:#f0b90b12;color:#ffe58f}.spacer{flex:1}.status{color:var(--m);font-size:12px}.frame{width:100%;height:calc(100% - 54px);border:0;display:block;background:var(--b)}
@media(max-width:700px){.top{height:auto;min-height:54px;flex-wrap:wrap}.brand{width:100%}.tabs{margin-left:0}.status{width:100%}.frame{height:calc(100% - 104px)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>CRYPTO</span> LAB v79 · BACKTEST</div><div class="tabs"><button id="exact" class="on">Scanner v15 EXACT</button><button id="classic">Classic</button></div><div class="spacer"></div><div id="status" class="status">Production parity mode</div></header>
<iframe id="engine" class="frame" title="Backtest engine"></iframe>
<script>
'use strict';const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let lang=q.get('lang')||localStorage.getItem('cryptoLabLanguage')||'ru';let mode=q.get('engine')==='classic'?'classic':'exact';
const labels={ru:{exact:'Scanner v15 EXACT',classic:'Classic',exactStatus:'Точное воспроизведение Scanner v15 · rank + news archive',classicStatus:'Классический EMA/RSI/ATR backtest'},uk:{exact:'Scanner v15 EXACT',classic:'Classic',exactStatus:'Точне відтворення Scanner v15 · rank + news archive',classicStatus:'Класичний EMA/RSI/ATR backtest'},en:{exact:'Scanner v15 EXACT',classic:'Classic',exactStatus:'Exact Scanner v15 replay · rank + news archive',classicStatus:'Classic EMA/RSI/ATR backtest'}};
function openMode(next){mode=next;const t=labels[lang]||labels.ru;$('exact').classList.toggle('on',mode==='exact');$('classic').classList.toggle('on',mode==='classic');$('exact').textContent=t.exact;$('classic').textContent=t.classic;$('status').textContent=mode==='exact'?t.exactStatus:t.classicStatus;$('engine').src=(mode==='exact'?'./backtest-v15.html':'./backtest.html')+'?lang='+encodeURIComponent(lang)+'&embedded=1';const u=new URL(location.href);u.searchParams.set('engine',mode);u.searchParams.set('lang',lang);history.replaceState(null,'',u);}
$('exact').onclick=()=>openMode('exact');$('classic').onclick=()=>openMode('classic');addEventListener('message',e=>{if(e.data?.type==='crypto-lab-language'&&labels[e.data.lang]){lang=e.data.lang;openMode(mode)}});openMode(mode);
</script>
</body></html>
