s="brand"><span>CRYPTO</span> LAB v79 · SCANNER</div><div class="spacer"></div><span id="quota" class="muted">FREE</span><button id="refresh" class="gold">Обновить</button><select id="lang"><option value="ru">RU</option><option value="uk">UA</option><option value="en">EN</option></select></header><main class="wrap"><div id="notice" class="notice">FREE Scanner: свежий A+ поиск работает в shadow-режиме. Кандидаты показываются на сайте, но экспериментальные Telegram-сигналы пока не отправляются.</div><section class="stats"><div class="card"><span>Монет</span><b id="markets">—</b></div><div class="card"><span>Class A+</span><b id="a">—</b></div><div class="card"><span>Class B</span><b id="b">—</b></div><div class="card"><span>Class C</span><b id="c">—</b></div><div class="card"><span>Shadow</span><b id="new">—</b></div><div class="card"><span>Ошибки</span><b id="errors">—</b></div></section><div class="filters"><select id="status"><option value="all">Все</option><option value="SHADOW">SHADOW</option><option value="WAITING">WAITING</option><option value="ACTIVE">ACTIVE</option><option value="CLOSED">CLOSED</option></select><select id="dir"><option value="all">LONG + SHORT</option><option>LONG</option><option>SHORT</option></select><select id="tf"><option value="all">Все TF</option><option>5M</option><option>1H</option><option>4H</option></select><input id="search" placeholder="Монета"></div><div class="table"><table><thead><tr><th>Монета</th><th>TF</th><th>Side</th><th>Сила</th><th>Статус</th><th>Цена</th><th>Вход</th><th>Stop</th><th>TP1</th><th>TP3</th><th>Обновлено</th></tr></thead><tbody id="body"><tr><td colspan="11" class="empty">Загрузка…</td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=supabase.createClient('https://txhzxbizjpinowepfjkm.supabase.co','sb_publishable_Kto-qK3BBI21ZxwGzxAmKg_A01NLpdZ',{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),Q=new URLSearchParams(location.search);let lang=Q.get('lang')||localStorage.getItem('cryptoLabLanguage')||'ru',DATA={signals:[]};function price(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:n>=1?5:10}):'—'}function date(v){return v?new Intl.DateTimeFormat(lang==='uk'?'uk-UA':lang==='en'?'en-GB':'ru-RU',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):'—'}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const st=$('status').value,di=$('dir').value,tf=$('tf').value,q=$('search').value.trim().toUpperCase(),rows=(DATA.signals||[]).filter(s=>(st==='all'||s.status===st)&&(di==='all'||s.direction===di)&&(tf==='all'||s.timeframe===tf)&&(!q||s.symbol.includes(q)));$('body').innerHTML=rows.length?rows.map(s=>`<tr><td><b>${safe(s.symbol)}</b></td><td>${safe(s.timeframe)}</td><td class="${s.direction==='LONG'?'pos':'neg'}">${safe(s.direction)}</td><td>${s.strength??'—'}</td><td class="${s.status==='SHADOW'?'shadow':''}">${safe(s.status)}</td><td>${price(s.last_price)}</td><td>${price(s.entry_low)}–${price(s.entry_high)}</td><td class="neg">${price(s.stop)}</td><td class="pos">${price(s.tp1)}</td><td class="pos">${price(s.tp3)}</td><td>${date(s.updated_at||s.created_at)}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">Сейчас нет A+ кандидатов. Это нормальный результат строгого фильтра.</td></tr>'}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('quota').textContent='FREE · требуется вход';$('body').innerHTML='<tr><td colspan="11" class="empty">Откройте Аккаунт и войдите или бесплатно зарегистрируйтесь.</td></tr>';return}$('refresh').disabled=true;try{const {data,error}=await sb.functions.invoke('crypto-lab-v79-scanner',{body:{}});if(error)throw error;if(data?.error)throw Error(data.error);DATA=data;const r=data.latest_run||{};$('markets').textContent=r.symbols_checked??'—';$('a').textContent=r.class_a_found??'—';$('b').textContent=r.class_b_found??'—';$('c').textContent=r.class_c_found??'—';$('new').textContent=(data.shadow_candidates||[]).length;$('errors').textContent=Array.isArray(r.errors)?r.errors.length:'—';$('quota').textContent='FREE · Scanner ∞';render()}catch(e){$('quota').textContent='Ошибка';$('body').innerHTML=`<tr><td colspan="11" class="empty neg">${safe(e.message||e)}</td></tr>`}finally{$('refresh').disabled=false}}$('refresh').onclick=load;['status','dir','tf'].forEach(id=>$(id).onchange=render);$('search').oninput=render;$('lang').value=lang;$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('cryptoLabLanguage',lang);render()};load();setInterval(load,30000);</script></body></html>
