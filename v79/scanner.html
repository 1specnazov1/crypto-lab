<body>

<script>

function price(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:n>=1?5:10}):'—'}
function date(v){return v?new Intl.DateTimeFormat(lang==='uk'?'uk-UA':lang==='en'?'en-GB':'ru-RU',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):'—'}

function compact(v){const n=Number(v);if(!Number.isFinite(n))return'—';const a=Math.abs(n);return(a>=1e9?(n/1e9).toFixed(1)+'B':a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e3?(n/1e3).toFixed(0)+'K':n.toFixed(0))}

function smartCell(s){const sm=s?.metrics?.smart_money;if(!sm||sm.supported===false||!Number.isFinite(Number(sm.score)))return '<span class="smart none">—</span>';const score=Number(sm.score),dir=String(sm.direction||'NEUTRAL'),cls=dir==='BUY'?'buy':dir==='SELL'?'sell':'neutral',delta=Number(sm.whale_delta_usd),oi=Number(sm.open_interest_change_pct);const title=`Whale Δ ${Number.isFinite(delta)?compact(delta):'—'} · OI Δ ${Number.isFinite(oi)?oi.toFixed(2)+'%':'—'} · CVD ${Number.isFinite(Number(sm.cvd_pressure))?(Number(sm.cvd_pressure)*100).toFixed(1)+'%':'—'}`;return `<span class="smart ${cls}" title="${safe(title)}">${safe(dir)} ${score}</span><span class="smart-sub">adj ${Number(s?.metrics?.smart_adjustment||0)>0?'+':''}${Number(s?.metrics?.smart_adjustment||0)}</span>`}

async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('quota').textContent='FREE · требуется вход';$('body').innerHTML=`<tr><td colspan="12" class="empty">${safe(tr().auth)}</td></tr>`;return}$('refresh').disabled=true;try{const {data,error}=await sb.functions.invoke('crypto-lab-v79-scanner',{body:{}});if(error)throw error;if(data?.error)throw Error(data.error);DATA=data;const r=data.latest_run||{};$('markets').textContent=r.symbols_checked??'—';$('a').textContent=r.class_a_found??'—';$('b').textContent=r.class_b_found??'—';$('c').textContent=r.class_c_found??'—';$('new').textContent=(data.shadow_candidates||[]).length;$('errors').textContent=Array.isArray(r.errors)?r.errors.length:'—';$('quota').textContent=`FREE · v${r.scanner_version||'—'} · Scanner ∞`;render()}catch(e){$('quota').textContent='Ошибка';$('body').innerHTML=`<tr><td colspan="12" class="empty neg">${safe(e.message||e)}</td></tr>`}finally{$('refresh').disabled=false}}
