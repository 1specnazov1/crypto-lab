<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e11"><title>CRYPTO LAB — Education</title><style>:root{--bg:#0b0e11;--p:#151a21;--p2:#1e2329;--line:#2b3139;--text:#eaecef;--muted:#848e9c;--gold:#f0b90b;--ok:#0ecb81;--bad:#f6465d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#101317;border-bottom:1px solid var(--line)}.top b{font-size:16px}.top span{display:block;color:var(--muted);font-size:10px}.top select{margin-left:auto;background:var(--p2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}.wrap{max-width:1080px;margin:auto;padding:14px}.hero{padding:18px;border:1px solid #f0b90b44;background:#f0b90b0c;border-radius:12px;margin-bottom:12px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#c7cdd5;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:14px}.card h2{font-size:15px;margin:0 0 8px}.card p,.card li,.step{color:#b7bec8;line-height:1.55}.card ul{padding-left:18px;margin:8px 0}.badge{display:inline-block;border:1px solid #0ecb8144;background:#0ecb8110;color:#8ce8c0;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.risk{border-color:#f6465d44;background:#f6465d0b}.risk .badge{border-color:#f6465d55;background:#f6465d10;color:#ffadb9}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a{display:inline-block;text-decoration:none;color:#fff;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.actions a.gold{border-color:#f0b90b55;color:#ffe58f;background:#f0b90b10}.steps{counter-reset:s}.step{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:8px 0}.step:before{counter-increment:s;content:counter(s);width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#f0b90b15;color:#f0b90b;border:1px solid #f0b90b44;font-weight:900}.foot{color:var(--muted);font-size:10px;padding:14px 2px 4px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.hero h1{font-size:20px}.top{min-height:58px}.card{padding:12px}}</style></head><body><header class="top"><div><b id="brand"></b><span id="sub"></span></div><select id="lang" aria-label="Language"><option value="ru">RU</option><option value="uk">UA</option><option value="en">EN</option></select></header><main class="wrap"><section class="hero"><span class="badge">PUBLIC FREE</span><h1 id="title"></h1><p id="intro"></p></section><div class="grid"><section class="card"><h2 id="hStart"></h2><div class="steps"><div class="step" id="s1"></div><div class="step" id="s2"></div><div class="step" id="s3"></div><div class="step" id="s4"></div></div><div class="actions"><a class="gold" href="./app.html?route=analytics" target="_top" id="aChart"></a><a href="./app.html?route=scanner" target="_top" id="aScanner">Scanner</a></div></section><section class="card"><h2 id="hTf"></h2><ul id="tfList"></ul><p id="tfRule"></p></section><section class="card"><h2 id="hScanner"></h2><p id="scannerText"></p><ul id="scannerList"></ul></section><section class="card"><h2 id="hAi"></h2><p id="aiText"></p><div class="actions"><a href="./app.html?route=ai" target="_top" id="aAi"></a></div></section><section class="card"><h2 id="hBt"></h2><p id="btText"></p><div class="actions"><a href="./app.html?route=backtest" target="_top" id="aBt"></a></div></section><section class="card"><h2 id="hJournal"></h2><p id="journalText"></p><div class="actions"><a href="./app.html?route=journal" target="_top" id="aJournal"></a></div></section><section class="card risk"><span class="badge">RISK</span><h2 id="hRisk"></h2><ul id="riskList"></ul></section><section class="card"><h2 id="hSafety"></h2><ul id="safetyList"></ul><div class="actions"><a href="./app.html?route=account" target="_top" id="aAccount"></a><a href="./app.html?route=support" target="_top" id="aSupport"></a></div></section></div><div class="foot" id="foot"></div></main><script>(()=>{const L={ru:{brand:'CRYPTO LAB · Обучение',sub:'Бесплатная база для безопасной работы с терминалом',title:'Как использовать CRYPTO LAB',intro:'Короткая практическая база: от графика и таймфреймов до Scanner, AI, Backtest, журнала и управления риском.',hStart:'1. Быстрый старт',s1:'Откройте график и выберите актив и таймфрейм.',s2:'Проверьте тренд, уровни, объём и RSI/EMA.',s3:'Сверьте идею со Scanner и AI-анализом.',s4:'До сделки заранее определите Stop Loss и допустимый риск.',aChart:'Открыть график',hTf:'2. Таймфреймы',tfList:'<li><b>1m–15m</b> — краткосрочная структура и точка входа.</li><li><b>1h–4h</b> — основной контекст тренда.</li><li><b>1D</b> — дневная структура рынка.</li><li><b>1W / 1M</b> — долгосрочное направление и крупные уровни.</li>',tfRule:'<b>Правило:</b> не принимайте решение только по одному таймфрейму.',hScanner:'3. Scanner и сигналы',scannerText:'Scanner v14 работает в shadow-режиме: он ищет A+ сетапы, но экспериментальные Telegram-сигналы не отправляет. Сам факт сигнала не является гарантией сделки.',scannerList:'<li>Проверяйте направление старшего контекста.</li><li>Смотрите Entry, Stop и цели как сценарий, а не обещание.</li><li>Если условия отмены выполнены — идея недействительна.</li>',hAi:'4. AI-анализ',aiText:'AI помогает структурировать рынок, риски и условия отмены сценария. Используйте его как второй аналитический слой, а не как автоторговлю.',aAi:'Открыть AI',hBt:'5. Backtest',btText:'Перед использованием идеи на реальном рынке проверяйте её на истории. Смотрите не только процент побед, но и средний результат в R, просадку и размер выборки.',aBt:'Открыть Backtest',hJournal:'6. Журнал сделок',journalText:'Записывайте вход, Stop, цели, причину сделки и итог. Журнал нужен, чтобы увидеть повторяющиеся ошибки и понять, какие сценарии действительно работают.',aJournal:'Открыть журнал',hRisk:'7. Управление риском',riskList:'<li>Stop Loss определяется до входа.</li><li>Не увеличивайте риск только из-за сильного сигнала.</li><li>Не используйте заёмные средства, если не понимаете риск ликвидации.</li><li>Серия убыточных сделок возможна даже у рабочей системы.</li>',hSafety:'8. Безопасность аккаунта',safetyList:'<li>Используйте уникальный пароль.</li><li>Никому не передавайте пароль, токены, seed phrase или private key.</li><li>CRYPTO LAB не просит seed phrase и не выполняет автоматические переводы.</li><li>При потере доступа используйте восстановление пароля.</li>',aAccount:'Аккаунт',aSupport:'Поддержка',foot:'CRYPTO LAB предоставляет аналитические инструменты. Это не финансовый совет и не гарантия результата.'},uk:{brand:'CRYPTO LAB · Навчання',sub:'Безкоштовна база для безпечної роботи з терміналом',title:'Як використовувати CRYPTO LAB',intro:'Коротка практична база: від графіка й таймфреймів до Scanner, AI, Backtest, журналу та керування ризиком.',hStart:'1. Швидкий старт',s1:'Відкрийте графік і виберіть актив та таймфрейм.',s2:'Перевірте тренд, рівні, обсяг і RSI/EMA.',s3:'Зіставте ідею зі Scanner та AI-аналізом.',s4:'До угоди заздалегідь визначте Stop Loss і допустимий ризик.',aChart:'Відкрити графік',hTf:'2. Таймфрейми',tfList:'<li><b>1m–15m</b> — короткострокова структура та точка входу.</li><li><b>1h–4h</b> — основний контекст тренду.</li><li><b>1D</b> — денна структура ринку.</li><li><b>1W / 1M</b> — довгостроковий напрям і великі рівні.</li>',tfRule:'<b>Правило:</b> не приймайте рішення лише за одним таймфреймом.',hScanner:'3. Scanner і сигнали',scannerText:'Scanner v14 працює в shadow-режимі: він шукає A+ сетапи, але експериментальні Telegram-сигнали не надсилає. Сам факт сигналу не є гарантією угоди.',scannerList:'<li>Перевіряйте напрям старшого контексту.</li><li>Розглядайте Entry, Stop і цілі як сценарій, а не обіцянку.</li><li>Якщо виконані умови скасування — ідея недійсна.</li>',hAi:'4. AI-аналіз',aiText:'AI допомагає структурувати ринок, ризики та умови скасування сценарію. Використовуйте його як другий аналітичний шар, а не як автоторгівлю.',aAi:'Відкрити AI',hBt:'5. Backtest',btText:'Перед використанням ідеї на реальному ринку перевіряйте її на історії. Дивіться не лише на відсоток перемог, а й на середній результат у R, просадку та розмір вибірки.',aBt:'Відкрити Backtest',hJournal:'6. Журнал угод',journalText:'Записуйте вхід, Stop, цілі, причину угоди та результат. Журнал допомагає побачити повторювані помилки й зрозуміти, які сценарії справді працюють.',aJournal:'Відкрити журнал',hRisk:'7. Керування ризиком',riskList:'<li>Stop Loss визначається до входу.</li><li>Не збільшуйте ризик лише через сильний сигнал.</li><li>Не використовуйте позикові кошти, якщо не розумієте ризик ліквідації.</li><li>Серія збиткових угод можлива навіть у робочої системи.</li>',hSafety:'8. Безпека акаунта',safetyList:'<li>Використовуйте унікальний пароль.</li><li>Нікому не передавайте пароль, токени, seed phrase або private key.</li><li>CRYPTO LAB не просить seed phrase і не виконує автоматичні перекази.</li><li>У разі втрати доступу використовуйте відновлення пароля.</li>',aAccount:'Акаунт',aSupport:'Підтримка',foot:'CRYPTO LAB надає аналітичні інструменти. Це не фінансова порада і не гарантія результату.'},en:{brand:'CRYPTO LAB · Education',sub:'Free guide for safer terminal use',title:'How to use CRYPTO LAB',intro:'A practical guide from charts and timeframes to Scanner, AI, Backtest, Journal and risk management.',hStart:'1. Quick start',s1:'Open the chart and choose an asset and timeframe.',s2:'Check trend, levels, volume and RSI/EMA.',s3:'Cross-check the idea with Scanner and AI analysis.',s4:'Define Stop Loss and acceptable risk before entering a trade.',aChart:'Open chart',hTf:'2. Timeframes',tfList:'<li><b>1m–15m</b> — short-term structure and entry timing.</li><li><b>1h–4h</b> — primary trend context.</li><li><b>1D</b> — daily market structure.</li><li><b>1W / 1M</b> — long-term direction and major levels.</li>',tfRule:'<b>Rule:</b> do not make a decision from one timeframe alone.',hScanner:'3. Scanner and signals',scannerText:'Scanner v14 runs in shadow mode: it looks for A+ setups, while experimental Telegram signals remain disabled. A signal is not a guarantee of a trade outcome.',scannerList:'<li>Check the higher-timeframe direction.</li><li>Treat Entry, Stop and targets as a scenario, not a promise.</li><li>If invalidation conditions are met, the setup is no longer valid.</li>',hAi:'4. AI analysis',aiText:'AI helps structure market context, risks and invalidation conditions. Use it as a second analytical layer, not as auto-trading.',aAi:'Open AI',hBt:'5. Backtest',btText:'Test an idea on historical data before using it in the live market. Review not only win rate, but also average R, drawdown and sample size.',aBt:'Open Backtest',hJournal:'6. Trade Journal',journalText:'Record entry, Stop, targets, trade rationale and outcome. The Journal helps reveal repeated mistakes and identify which scenarios actually work.',aJournal:'Open Journal',hRisk:'7. Risk management',riskList:'<li>Define Stop Loss before entry.</li><li>Do not increase risk just because a signal looks strong.</li><li>Do not use borrowed funds unless you understand liquidation risk.</li><li>A losing streak is possible even with a viable system.</li>',hSafety:'8. Account security',safetyList:'<li>Use a unique password.</li><li>Never share passwords, tokens, seed phrases or private keys.</li><li>CRYPTO LAB never asks for a seed phrase and does not perform automatic transfers.</li><li>Use password recovery if you lose access.</li>',aAccount:'Account',aSupport:'Support',foot:'CRYPTO LAB provides analytical tools. This is not financial advice and does not guarantee results.'}};const htmlKeys=new Set(['tfList','tfRule','scannerList','riskList','safetyList']);const p=new URLSearchParams(location.search);let lang=['ru','uk','en'].includes(p.get('lang'))?p.get('lang'):'ru';const $=id=>document.getElementById(id);function render(){document.documentElement.lang=lang;$('lang').value=lang;const t=L[lang];for(const[k,v]of Object.entries(t)){const el=$(k);if(!el)continue;if(htmlKeys.has(k))el.innerHTML=v;else el.textContent=v}}$('lang').onchange=e=>{lang=e.target.value;render()};addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='crypto-lab-language'&&L[e.data.lang]){lang=e.data.lang;render()}});render()})()</script></body></html>
