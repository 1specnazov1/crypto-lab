<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://txhzxbizjpinowepfjkm.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>CRYPTO LAB v79 · Admin</title>
<style>
:root{--bg:#0b0e11;--p:#151a21;--p2:#1e2329;--line:#2b3139;--t:#eaecef;--m:#848e9c;--g:#f0b90b;--ok:#0ecb81;--bad:#f6465d}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--t);font:12px system-ui}button,input,select{font:inherit}.top{display:flex;gap:10px;align-items:center;padding:11px 14px;background:#101317;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{font-weight:950}.brand span{color:var(--g)}.spacer{flex:1}.wrap{padding:14px;display:grid;gap:10px}.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(4,1fr)}.admin-main{grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr)}.card{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:13px}.card h2,.card h3{margin:0 0 10px}.stat span,.muted{color:var(--m)}.stat b{display:block;font-size:22px;margin-top:6px}button,input,select{background:var(--p2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.gold{border-color:#f0b90b55;color:#ffe58f;background:#f0b90b10}.bad{border-color:#f6465d55;color:#ffc4cd;background:#f6465d10}.login{max-width:440px;margin:50px auto}.field{margin:9px 0}.field label{display:block;color:var(--m);margin-bottom:5px}.field input{width:100%}.hide{display:none!important}.msg{padding:9px;border-radius:8px;background:#4d9fff12;border:1px solid #4d9fff44;display:none}.msg.show{display:block}.msg.err{background:#f6465d10;border-color:#f6465d44;color:#ffc4cd}.table{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#171c23;color:var(--m);font-size:9px;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap}.request{padding:10px;background:var(--p2);border-radius:8px;margin:7px 0}.request-head{display:flex;justify-content:space-between;gap:8px}.request p{white-space:pre-wrap;overflow-wrap:anywhere}.pos{color:var(--ok)}.neg{color:var(--bad)}
@media(max-width:900px){.admin-main{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.top{flex-wrap:wrap}.top .brand{width:100%}.top button{flex:1;min-height:42px}.wrap{padding:10px}.actions button{min-height:40px;flex:1}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>CRYPTO</span> LAB v79 · ADMIN</div><div class="spacer"></div><button id="refresh" class="hide">Обновить</button><button id="logout" class="bad hide">Выйти</button></header>
<main class="wrap">
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<section id="login" class="card login"><h2>Вход администратора</h2><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><button id="signIn" class="gold" type="submit">Войти</button></form><p class="muted">Доступ проверяется серверной ролью admin. Изменить роль из браузера невозможно.</p></section>
<section id="dashboard" class="hide"><div class="grid stats"><div class="card stat"><span>Пользователи</span><b id="users">—</b></div><div class="card stat"><span>FREE</span><b id="free">—</b></div><div class="card stat"><span>BASIC</span><b id="basic">—</b></div><div class="card stat"><span>PRO</span><b id="pro">—</b></div></div><div class="grid admin-main" style="margin-top:10px"><div class="card"><h3>Запросы на тариф</h3><div id="requests"></div></div><div class="card"><h3>Последние пользователи</h3><div class="table"><table><thead><tr><th>Email</th><th>Имя</th><th>Роль</th><th>Тариф</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const sb=supabase.createClient('https://txhzxbizjpinowepfjkm.supabase.co','sb_publishable_Kto-qK3BBI21ZxwGzxAmKg_A01NLpdZ',{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);
let summary=null,summaryLoading=false,operationBusy=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safePlan=value=>['FREE','BASIC','PRO'].includes(String(value))?String(value):'FREE';
const safeStatus=value=>['trialing','active','past_due','canceled','expired'].includes(String(value))?String(value):'active';
function message(value,bad=false){const box=$('msg');box.textContent=String(value??'');box.className='msg show'+(bad?' err':'');clearTimeout(message.timer);message.timer=setTimeout(()=>box.className='msg',6000)}
function setOperationBusy(busy){operationBusy=busy;$('signIn').disabled=busy;$('logout').disabled=busy;document.querySelectorAll('[data-request-action],[data-user-action]').forEach(button=>button.disabled=busy)}
async function load(){if(summaryLoading)return;summaryLoading=true;$('refresh').disabled=true;try{const {data,error}=await sb.rpc('get_crypto_admin_summary');if(error)throw error;summary=data||{};$('dashboard').classList.remove('hide');$('login').classList.add('hide');$('refresh').classList.remove('hide');$('logout').classList.remove('hide');$('users').textContent=Number(summary.users_total||0);$('free').textContent=Number(summary.plans?.FREE||0);$('basic').textContent=Number(summary.plans?.BASIC||0);$('pro').textContent=Number(summary.plans?.PRO||0);renderRequests();renderUsers()}catch(error){message(error.message||error,true);$('dashboard').classList.add('hide');$('login').classList.remove('hide')}finally{summaryLoading=false;$('refresh').disabled=false}}
function renderRequests(){const list=Array.isArray(summary?.pending_requests)?summary.pending_requests:[];$('requests').innerHTML=list.length?list.map((item,index)=>`<article class="request"><div class="request-head"><b>${esc(item.email||'—')}</b><span class="pos">${esc(safePlan(item.requested_plan))}</span></div><div class="muted">${esc(item.display_name||'—')} · ${esc(item.created_at?new Date(item.created_at).toLocaleString():'—')}</div><p>${esc(item.user_note||'—')}</p><div class="actions"><button class="gold" data-request-action="approve" data-index="${index}">Одобрить</button><button class="bad" data-request-action="reject" data-index="${index}">Отклонить</button></div></article>`).join(''):'<div class="muted">Нет запросов</div>';$('requests').querySelectorAll('[data-request-action]').forEach(button=>button.onclick=()=>{const item=list[Number(button.dataset.index)];if(!item)return;if(button.dataset.requestAction==='approve')setPlan(item.user_id,safePlan(item.requested_plan),'active',item.id,30);else setPlan(item.user_id,'FREE','active',item.id,null,'Запрос отклонён')})}
function renderUsers(){const list=Array.isArray(summary?.recent_users)?summary.recent_users:[];$('usersBody').innerHTML=list.length?list.map((item,index)=>`<tr><td>${esc(item.email||'—')}</td><td>${esc(item.display_name||'—')}</td><td>${esc(item.role||'user')}</td><td>${esc(safePlan(item.plan))}</td><td>${esc(safeStatus(item.status))}</td><td><div class="actions"><button data-user-action="BASIC" data-index="${index}">BASIC</button><button data-user-action="PRO" data-index="${index}">PRO</button><button class="bad" data-user-action="FREE" data-index="${index}">FREE</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Пользователей пока нет</td></tr>';$('usersBody').querySelectorAll('[data-user-action]').forEach(button=>button.onclick=()=>{const item=list[Number(button.dataset.index)],plan=safePlan(button.dataset.userAction);if(!item?.user_id)return;if(plan==='FREE'&&!confirm(`Перевести ${item.email||'пользователя'} на FREE?`))return;setPlan(item.user_id,plan,'active',null,plan==='FREE'?null:30)})}
async function setPlan(user,plan,status,requestId,days,note='Admin panel'){if(operationBusy)return;setOperationBusy(true);let saved=false;try{const end=days?new Date(Date.now()+days*86400000).toISOString():null;const {data,error}=await sb.rpc('admin_set_crypto_subscription',{p_user_id:user,p_plan:safePlan(plan),p_status:safeStatus(status),p_period_end:end,p_request_id:requestId||null,p_admin_note:String(note||'').slice(0,1000)});if(error)throw error;message(`${safePlan(data?.plan)} сохранён`);saved=true}catch(error){message(error.message||error,true)}finally{setOperationBusy(false)}if(saved)await load()}
$('loginForm').onsubmit=async event=>{event.preventDefault();if(operationBusy)return;setOperationBusy(true);let signedIn=false;try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';signedIn=true}catch(error){message(error.message||error,true)}finally{setOperationBusy(false)}if(signedIn)await load()};
$('logout').onclick=async()=>{if(operationBusy)return;setOperationBusy(true);try{await sb.auth.signOut();summary=null}finally{setOperationBusy(false)}};
$('refresh').onclick=load;
sb.auth.onAuthStateChange((_event,session)=>{if(session)load();else{$('login').classList.remove('hide');$('dashboard').classList.add('hide');$('refresh').classList.add('hide');$('logout').classList.add('hide')}});
sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script>
</body>
</html>
