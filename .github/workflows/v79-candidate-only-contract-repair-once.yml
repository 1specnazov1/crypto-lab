name: Repair Candidate-only Manifest Contract Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-candidate-only-contract-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore strict manifest shape
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          for item in manifest.get('migrations',[]):
            item.pop('authoritative',None)
          evidence=manifest.get('release_evidence',{})
          allowed={'release_gate_run_id','maintenance_evidence_gate_run_id','browser_smoke_run_id','pages_run_id','technical_score','commercial_score'}
          for key in list(evidence):
            if key not in allowed:
              evidence.pop(key,None)
          op=manifest.setdefault('operational_hardening',{})
          op['onchain_payment_gate_run_id']='30994527619'
          op['candidate_only_payment_repair_verified']=True
          op['candidate_only_manifest_contract_repaired']=True
          manifest['updated_at']='2026-08-05T09:46:00Z'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-candidate-only-contract-repair-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-candidate-only-contract-repair-once.yml
          git commit -m 'Repair candidate-only release manifest contract'
          git push
      - name: Dispatch strict validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
