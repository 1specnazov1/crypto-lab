name: Authoritative 103527 Evidence Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-103527-authoritative-sync-once.yml'
      - 'scripts/sync_authoritative_103527.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v79-authoritative-103527-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.head_commit.message != 'Bind authoritative candidate-only recovery after 103010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize evidence
        run: python scripts/sync_authoritative_103527.py
      - name: Commit synchronized evidence
        run: |
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-onchain-payments.json docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-onchain-payment-foundation-validation.yml .github/workflows/v79-owner-decision-failclosed-validation.yml
          if git diff --cached --quiet; then
            echo 'Evidence already synchronized'
          else
            git commit -m 'Bind authoritative candidate-only recovery after 103010'
            git push
          fi
      - name: Dispatch final validation gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
