name: Validate v79 Auth Launch Contract

on:
  push:
    branches: [main]
    paths:
      - 'v79/registration-consent.js'
      - 'v79/auth-gateway.js'
      - 'v79/recovery.html'
      - 'supabase/functions/crypto-lab-v79-register/index.ts'
      - 'supabase/functions/crypto-lab-v79-confirm/index.ts'
      - 'supabase/functions/crypto-lab-v79-recover/index.ts'
      - 'supabase/functions/crypto-lab-v79-recovery-complete/index.ts'
      - 'supabase/functions/crypto-lab-mail-dispatch/index.ts'
      - '.github/workflows/v79-auth-launch-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate public free registration consent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('v79/registration-consent.js').read_text()
          assert "REQUIRED_KEYS=new Set(['terms','privacy','risk'])" in text
          for key in ('terms','privacy','risk'):
              assert f"'{key}'" in text
          assert "'refund'" not in text
          assert 'free-access-ui.js' in text
          assert './auth-gateway.js' in text
          print('Three-document FREE frontend consent contract passed')
          PY

      - name: Validate protected public free auth backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          register=Path('supabase/functions/crypto-lab-v79-register/index.ts').read_text()
          confirm=Path('supabase/functions/crypto-lab-v79-confirm/index.ts').read_text()
          recover=Path('supabase/functions/crypto-lab-v79-recover/index.ts').read_text()
          complete=Path('supabase/functions/crypto-lab-v79-recovery-complete/index.ts').read_text()
          gateway=Path('v79/auth-gateway.js').read_text()
          recovery_page=Path('v79/recovery.html').read_text()

          for marker in ('LEGAL=["terms","privacy","risk"]','crypto_commercial_runtime_flags','public_registration_enabled','production_launch_authorized','crypto_account_portal_config','registration_enabled','public_free','hashed_token','crypto-lab-v79-confirm'):
              assert marker in register, marker
          assert 'CRYPTO_PUBLIC_REGISTRATION_ENABLED' not in register
          assert 'owner_bootstrap' not in register

          for marker in ('crypto_account_portal_config','recovery_enabled','hashed_token','RECOVERY_PAGE','recovery.html'):
              assert marker in recover, marker
          assert 'CRYPTO_PUBLIC_RECOVERY_ENABLED' not in recover

          for text,action in ((register,'crypto_register'),(recover,'crypto_recover')):
              for marker in ('https://challenges.cloudflare.com/turnstile/v0/siteverify','CRYPTO_TURNSTILE_SITE_KEY','CRYPTO_TURNSTILE_SECRET_KEY','RESEND_API_KEY','CRYPTO_MAIL_FROM',action):
                  assert marker in text, marker

          assert 'verifyOtp' in confirm and 'token_hash' in confirm and 'signup' in confirm
          assert 'verifyOtp' in complete and 'token_hash' in complete and 'recovery' in complete
          assert 'updateUserById' in complete
          assert 'history.replaceState' in recovery_page
          assert 'no-referrer' in recovery_page.lower()
          assert 'direct_supabase_signup_bypassed:true' in gateway
          print('Public FREE Turnstile/mail/token-safe auth gates passed')
          PY

      - name: Validate mail provider action URL allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/functions/crypto-lab-mail-dispatch/index.ts').read_text()
          for marker in ('https://api.resend.com/emails','Idempotency-Key','signup_confirmation','password_recovery','ALLOWED_TEMPLATES','ALLOWED_LOCALES','safeActionUrl','crypto-lab-v79-confirm','/crypto-lab/v79/recovery.html','1specnazov1.github.io','txhzxbizjpinowepfjkm.supabase.co','SUPABASE_SERVICE_ROLE_KEY'):
              assert marker in text, marker
          assert 'body.subject' not in text and 'body.html' not in text
          print('Public FREE Resend action URL contract passed')
          PY

      - name: Validate secret and stable v78 boundaries
        run: |
          test "$(git hash-object index.html)" = '4a278c891d37b3760ec1ac988690ea9ad587b24e'
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[
            'v79/auth-gateway.js','v79/registration-consent.js','v79/recovery.html',
            'supabase/functions/crypto-lab-v79-register/index.ts',
            'supabase/functions/crypto-lab-v79-confirm/index.ts',
            'supabase/functions/crypto-lab-v79-recover/index.ts',
            'supabase/functions/crypto-lab-v79-recovery-complete/index.ts',
            'supabase/functions/crypto-lab-mail-dispatch/index.ts'
          ]
          text='\n'.join(Path(p).read_text() for p in paths)
          for pattern in [r'sb_secret_',r'sk_live_',r'sk_test_',r'whsec_',r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',r'Bearer\s+eyJ']:
              assert not re.search(pattern,text,re.I),pattern
          print('Auth secret/v78 boundaries passed')
          PY
