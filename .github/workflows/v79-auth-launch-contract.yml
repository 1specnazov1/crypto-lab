name: Validate v79 Auth Launch Contract

on:
  push:
    branches: [main]
    paths:
      - 'v79/registration-consent.js'
      - 'v79/auth-gateway.js'
      - 'supabase/functions/crypto-lab-v79-register/index.ts'
      - 'supabase/functions/crypto-lab-v79-recover/index.ts'
      - 'supabase/functions/crypto-lab-mail-dispatch/index.ts'
      - 'supabase/migrations/*owner_admin_bootstrap*.sql'
      - '.github/workflows/v79-auth-launch-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate four-document registration consent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('v79/registration-consent.js').read_text()
          for key in ('terms','privacy','refund','risk'):
              assert f"'{key}'" in text
          assert "REQUIRED_KEYS=new Set(['terms','privacy','refund','risk'])" in text
          assert 'Политика возвратов' in text
          assert 'Політика повернень' in text
          assert 'Refund Policy' in text
          assert 'docs.length===3' not in text
          print('Four-document frontend consent contract passed')
          PY

      - name: Validate protected auth backend gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          register=Path('supabase/functions/crypto-lab-v79-register/index.ts').read_text()
          recover=Path('supabase/functions/crypto-lab-v79-recover/index.ts').read_text()
          gateway=Path('v79/auth-gateway.js').read_text()
          assert 'const REQUIRED_LEGAL_KEYS = ["terms", "privacy", "refund", "risk"]' in register
          assert 'CRYPTO_PUBLIC_REGISTRATION_ENABLED' in register
          assert 'CRYPTO_PUBLIC_RECOVERY_ENABLED' in recover
          assert 'service_crypto_owner_admin_bootstrap_status' in register
          assert 'owner_bootstrap' in register
          assert 'email !== ownerEmail' in register
          for text,action in ((register,'crypto_register'),(recover,'crypto_recover')):
              assert 'https://challenges.cloudflare.com/turnstile/v0/siteverify' in text
              assert 'CRYPTO_TURNSTILE_SITE_KEY' in text
              assert 'CRYPTO_TURNSTILE_SECRET_KEY' in text
              assert action in text
              assert 'RESEND_API_KEY' in text
              assert 'CRYPTO_MAIL_FROM' in text
          assert 'direct_supabase_signup_bypassed:true' in gateway
          print('Turnstile/mail/owner-bootstrap/feature-flag auth gates passed')
          PY

      - name: Validate mail provider contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/functions/crypto-lab-mail-dispatch/index.ts').read_text()
          assert 'https://api.resend.com/emails' in text
          assert 'Idempotency-Key' in text
          assert 'signup_confirmation' in text and 'password_recovery' in text
          assert 'ALLOWED_TEMPLATES' in text and 'ALLOWED_LOCALES' in text
          assert 'safeActionUrl' in text and 'txhzxbizjpinowepfjkm.supabase.co' in text
          assert 'body.subject' not in text and 'body.html' not in text
          assert 'SUPABASE_SERVICE_ROLE_KEY' in text
          print('Direct Resend provider contract passed')
          PY

      - name: Validate one-time owner admin bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bootstrap=Path('supabase/migrations/20260807185300_prepare_one_time_owner_admin_bootstrap.sql').read_text().lower()
          helper=Path('supabase/migrations/20260807191300_expose_service_only_owner_admin_bootstrap_status.sql').read_text().lower()
          assert 'crypto_admin_bootstrap_config' in bootstrap
          assert "role='admin'" in bootstrap
          assert 'consumed_at' in bootstrap and 'authorized=false' in bootstrap
          assert 'email_confirmed_at' in bootstrap
          assert 'insert into auth.users' not in bootstrap
          assert 'create user' not in bootstrap
          assert 'service_crypto_owner_admin_bootstrap_status' in helper
          assert 'security definer' in helper
          assert 'revoke all' in helper and 'anon' in helper and 'authenticated' in helper
          assert 'grant execute' in helper and 'service_role' in helper
          assert 'allowed_email' in helper and 'admin_exists' in helper
          print('One-time real-owner admin bootstrap contract passed')
          PY
