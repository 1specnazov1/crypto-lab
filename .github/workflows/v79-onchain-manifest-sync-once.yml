name: Sync On-chain Migrations Into Release Manifest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-onchain-manifest-sync-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add on-chain migrations to release manifest
        run: |
          python - <<'PY'
          import json, pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          additions=[
            {'version':'20260805085503','name':'crypto_billing_onchain_adapter_contract','source':'supabase/migrations/20260805085503_crypto_billing_onchain_adapter_contract.sql','source_commit':'e7ee37796cccfbdd44ca967c0709c6ac56080d32'},
            {'version':'20260805085615','name':'crypto_three_network_onchain_catalog','source':'supabase/migrations/20260805085615_crypto_three_network_onchain_catalog.sql','source_commit':'a4bd27d3cfba4ed3a21a78c5a1730253e597bf88'},
            {'version':'20260805085735','name':'crypto_three_network_onchain_services','source':'supabase/migrations/20260805085735_crypto_three_network_onchain_services.sql','source_commit':'b388160fe462e79d5c958368472eca415736bdf7'},
            {'version':'20260805085807','name':'crypto_three_network_onchain_security_and_launch_control','source':'supabase/migrations/20260805085807_crypto_three_network_onchain_security_and_launch_control.sql','source_commit':'3450b8dbaae838a3b543edf4d4e8553f69439817'}
          ]
          existing={(m.get('version'),m.get('name')) for m in manifest['migrations']}
          manifest['migrations'].extend(m for m in additions if (m['version'],m['name']) not in existing)
          manifest['updated_at']='2026-08-05T09:15:00Z'
          manifest['application']['evidence_commit']='c0ee44d9f08eaff43a6541cfdfe448fbe91bf4ee'
          manifest['release_evidence']['release_gate_run_id']='pending'
          manifest['release_evidence']['browser_smoke_run_id']='pending'
          manifest['release_evidence']['pages_run_id']='pending'
          operational=manifest.setdefault('operational_hardening',{})
          operational['onchain_payment_foundation']='three_network_disabled_pending_decisions'
          operational['onchain_payment_gate_run_id']='30992203761'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json
          git commit -m 'Bind three-network on-chain migrations to release manifest'
          git push
      - name: Dispatch validation gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
