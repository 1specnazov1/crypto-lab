name: Sync Protected Auth Manifest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-auth-manifest-sync-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize auth release manifest
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']='2026-08-05T07:05:00Z'
          app=manifest['application']
          app['application_commit']='e1cbe2eb1cb9d97295ecfc9836d0f9bac9cfc191'
          app['evidence_commit']='a2bce0fc1ffc1acbc0221f59c6f3322af731d1d7'
          app['pwa_cache']='crypto-lab-v79-7930-auth1'
          markers={
            'v79/index.html':'app.html?v=7930',
            'v79/app.html':'commercial-extension.js?v=7930',
            'v79/commercial-extension.js':'protectedAuthGatewayScript',
            'v79/service-worker.js':'crypto-lab-v79-7930-auth1',
            'v79/auth-gateway.js':'direct_supabase_signup_bypassed:true',
            'v79/admin-integrity.js':'get_crypto_admin_data_integrity',
            'v79/admin-ops-summary.js':'get_crypto_admin_operational_summary',
            'v79/admin-drift.js':'get_crypto_admin_release_drift',
            'v79/admin-maintenance.js':'get_crypto_admin_maintenance_evidence'
          }
          app['assets']=[{
            'path':p,
            'sha':subprocess.check_output(['git','hash-object',p],text=True).strip(),
            'marker':m
          } for p,m in markers.items()]
          for edge in manifest['edge_functions']:
            if edge['slug']=='crypto-lab-v79-register': edge['version']=3
            if edge['slug']=='crypto-lab-v79-recover': edge['version']=2
          evidence=manifest['release_evidence']
          evidence['release_gate_run_id']='pending'
          evidence['browser_smoke_run_id']='pending'
          evidence['pages_run_id']='pending'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm .github/workflows/v79-auth-manifest-sync-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-auth-manifest-sync-once.yml
          git commit -m 'Sync protected auth gateway release manifest'
          git push

      - name: Dispatch post-sync gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
          gh workflow run v79-auth-gateway-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
