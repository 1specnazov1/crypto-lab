name: Final Security Manifest Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-final-security-manifest-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v79-final-security-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add final service-only RLS evidence
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          item={
            'version':'20260805101117',
            'name':'explicit_deny_policies_for_service_only_audit_tables',
            'source':'supabase/migrations/20260805101117_explicit_deny_policies_for_service_only_audit_tables.sql',
            'source_commit':'fb5783add02ef266f6bc28e54ed5692f15422a47'
          }
          keyed={(m.get('version'),m.get('name')):m for m in manifest.setdefault('migrations',[])}
          key=(item['version'],item['name'])
          if key in keyed: keyed[key].update(item)
          else: manifest['migrations'].append(item)
          for migration in manifest['migrations']:
            for extra in list(migration):
              if extra not in {'version','name','source','source_commit'}:
                migration.pop(extra,None)

          manifest['updated_at']='2026-08-05T10:13:00Z'
          manifest.setdefault('application',{})['evidence_commit']='3188e112165ce805b770d3e429505c826df0f047'
          release=manifest.setdefault('release_evidence',{})
          allowed={'release_gate_run_id','maintenance_evidence_gate_run_id','browser_smoke_run_id','pages_run_id','technical_score','commercial_score'}
          for key in list(release):
            if key not in allowed: release.pop(key,None)
          release['release_gate_run_id']='pending'
          release['browser_smoke_run_id']='pending'
          release['pages_run_id']='pending'

          op=manifest.setdefault('operational_hardening',{})
          op.update({
            'security_advisor_lints':0,
            'service_only_audit_tables_explicit_deny_policies':True,
            'service_only_audit_policy_migration_version':'20260805101117',
            'service_only_audit_policy_source_commit':'fb5783add02ef266f6bc28e54ed5692f15422a47',
            'owner_decision_failclosed_gate_run_id':'30996348458',
            'onchain_payment_gate_run_id':'30996205989',
            'release_manifest_contract_run_id':'30996204473',
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-final-security-manifest-sync-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-final-security-manifest-sync-once.yml
          git commit -m 'Bind final service-only security evidence'
          git push
      - name: Dispatch final validation gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
