name: Validate v79 PWA Contract

on:
  push:
    branches: [main]
    paths:
      - 'v79/**'
      - '.github/workflows/v79-pwa-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate manifest and service worker
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('v79/manifest.webmanifest').read_text())
          assert m['display']=='standalone'
          assert m['scope']=='./'
          assert m['start_url'].startswith('./')
          assert m['name'].startswith('CRYPTO LAB')
          assert m['icons'] and all(i['src'].startswith('./') for i in m['icons'])
          worker=Path('v79/service-worker.js').read_text()
          assert "const CACHE='crypto-lab-v79-7930-free29'" in worker
          for asset in ['app.js','runtime-performance.js','news-extension.js','news-ticker-controls.js','news-ui-upgrades.js','news.html','public-free-home.js','home-intelligence.js','route-viewport-fix.js','chart-interactions.js','chart-live-price.js','chart-visual-upgrades.js','route-merge.js','access-gate.js','support.html','session-security.js','icon.svg','module-mobile.css','platform.css','admin.html','recovery.html','recovery-request.html']:
              assert f'./{asset}' in worker, asset
          assert "if(isApi(url)||url.origin!==self.location.origin)return" in worker
          assert "fetch(req,{cache:'no-store'})" in worker
          PY

      - name: Validate core JavaScript syntax
        run: |
          set -euo pipefail
          for f in v79/*.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for html in Path('v79').glob('*.html'):
              text=html.read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
              for i,script in enumerate(scripts):
                  if not script.strip(): continue
                  p=Path('/tmp')/f'{html.stem}-{i}.js'; p.write_text(script,encoding='utf-8')
                  subprocess.check_call(['node','--check',str(p)])
          PY

      - name: Validate security and performance contracts
        run: |
          grep -F 'content-visibility:auto' v79/runtime-performance.js
          grep -F "frame.src='about:blank'" v79/runtime-performance.js
          grep -F 'animation-play-state:paused' v79/runtime-performance.js
          grep -F 'scrollTo(0,0)' v79/route-viewport-fix.js
          grep -F 'agreeing.length<2' v79/chart-live-price.js
          grep -F 'const MAX_PASSES=3' v79/news-ticker-controls.js
          grep -F "hideCurrent('completed')" v79/news-ticker-controls.js
          if grep -F 'observer.observe(document.documentElement' v79/session-security.js; then
            echo 'Whole-document Account observer is forbidden' >&2; exit 1
          fi
          if grep -F 'observer.observe(document.documentElement' v79/news-ticker-controls.js; then
            echo 'Whole-document ticker observer is forbidden' >&2; exit 1
          fi

      - name: Validate Signals and Telegram admin contract
        run: |
          grep -F 'SHADOW Forward Quality' v79/admin-signals.html
          grep -F 'get_crypto_shadow_quality_admin' v79/admin-signals.html
          grep -F 'crypto-telegram-admin-preflight' v79/admin-signals.html
          grep -F 'LIVE TELEGRAM' v79/admin-signals.html
          grep -F 'TP1 → Stop в безубыток' v79/admin-signals.html
          if grep -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY\s*=|TELEGRAM_BOT_TOKEN\s*=|MONITOR_SECRET\s*=' v79/*.{html,js,json,webmanifest} 2>/dev/null; then
            echo 'Potential server secret value/assignment exposed in browser assets' >&2; exit 1
          fi

      - name: Validate readability and branding
        run: |
          grep -F '>CL</text>' v79/icon.svg
          grep -F '#00e5ff' v79/icon.svg
          grep -F 'CRYPTO LAB readability baseline' v79/platform.css
          grep -F 'Global module readability baseline' v79/module-mobile.css
          grep -F 'font-size:12px!important' v79/platform.css
          grep -F 'font-size:12px!important' v79/module-mobile.css
