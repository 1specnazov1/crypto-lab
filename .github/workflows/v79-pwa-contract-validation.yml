name: Validate v79 PWA Contract

on:
  push:
    branches: [main]
    paths:
      - 'v79/**'
      - '.github/workflows/v79-pwa-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate manifest and service worker
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('v79/manifest.webmanifest').read_text())
          assert m['display']=='standalone'
          assert m['scope']=='./'
          assert m['start_url'].startswith('./')
          assert m['name'].startswith('CRYPTO LAB')
          assert m['icons'] and all(i['src'].startswith('./') for i in m['icons'])
          PY
          grep -F "const CACHE='crypto-lab-v79-7930-free18'" v79/service-worker.js
          for asset in news-extension.js news.html chart-interactions.js chart-analysis-tools.js chart-analysis-hook.js chart-visual-upgrades.js chart-fib-scale.js chart-onchain.js route-merge.js access-gate.js support.html; do
            grep -F "./$asset" v79/service-worker.js
          done
          grep -F "if(isApi(url)||url.origin!==self.location.origin)return" v79/service-worker.js
          if grep -E "fetch\([^)]*(POST|PUT|PATCH|DELETE)" v79/service-worker.js; then
            echo 'Service worker must not perform write requests' >&2
            exit 1
          fi

      - name: Validate invite-only FREE access
        run: |
          node --check v79/access-gate.js
          node --check v79/auth-gateway.js
          node --check v79/registration-consent.js
          grep -F "invite_only_free" v79/auth-gateway.js
          grep -F "invite_token" v79/auth-gateway.js
          grep -F "crypto_access_request" v79/access-gate.js
          grep -F "account.html?login=1" v79/access-gate.js
          if grep -F "app.html?route=account&login=1" v79/access-gate.js; then
            echo 'Shell login bypass is forbidden' >&2
            exit 1
          fi

      - name: Validate five-minute market news center
        run: |
          node --check v79/news-extension.js
          test -s v79/news.html
          grep -F "news-extension.js?v=7930free12" v79/route-merge.js
          grep -F "ROUTES.splice(insertAt,0,['news','⚡'])" v79/news-extension.js
          grep -F "crypto-lab-v79-news" v79/news-extension.js
          grep -F "crypto-lab-v79-news" v79/news.html
          grep -F "setInterval(refreshTicker,300000)" v79/news-extension.js
          grep -F "setInterval(load,300000)" v79/news.html
          grep -F "BREAKING" v79/news-extension.js
          grep -F "Impact 55+" v79/news.html
          grep -F "data-region=\"US\"" v79/news.html
          grep -F "data-region=\"EUROPE\"" v79/news.html
          grep -F "data-region=\"CHINA\"" v79/news.html
          grep -F "data-region=\"JAPAN\"" v79/news.html
          grep -F "b.dataset.region='OTHER'" v79/news-extension.js
          grep -F "Другие страны" v79/news-extension.js

      - name: Validate chart analytics, simultaneous Fibonacci and resilient on-chain fallback
        run: |
          node --check v79/route-merge.js
          node --check v79/chart-interactions.js
          node --check v79/chart-analysis-tools.js
          node --check v79/chart-analysis-hook.js
          node --check v79/chart-visual-upgrades.js
          node --check v79/chart-fib-scale.js
          node --check v79/chart-onchain.js
          grep -F "chart-analysis-hook.js?v=7930free18" v79/route-merge.js
          grep -F "chart-visual-upgrades.js?v=7930free18" v79/route-merge.js
          grep -F "chart-fib-scale.js?v=7930free18" v79/route-merge.js
          grep -F "chart-onchain.js?v=7930free14" v79/route-merge.js
          grep -F "['ema','EMA']" v79/chart-analysis-tools.js
          grep -F "['fib','FIB']" v79/chart-analysis-tools.js
          grep -F "['macd','MACD']" v79/chart-analysis-tools.js
          grep -F "['bb','BB']" v79/chart-analysis-tools.js
          grep -F "['vwap','VWAP']" v79/chart-analysis-tools.js
          grep -F "['atr','ATR']" v79/chart-analysis-tools.js
          grep -F "function priceLabel" v79/chart-analysis-hook.js
          grep -F "canvas.width/dpr" v79/chart-analysis-hook.js
          grep -F "CryptoFibScaleLevels" v79/chart-analysis-hook.js
          if grep -F "CanvasRenderingContext2D.prototype" v79/chart-analysis-hook.js; then
            echo 'Native canvas prototype monkey-patching must not return' >&2
            exit 1
          fi
          grep -F "addEventListener('wheel'" v79/chart-interactions.js
          grep -F "formatTime(c.time)" v79/chart-interactions.js
          grep -F "AUTO SWING" v79/chart-visual-upgrades.js
          grep -F "const RETRACEMENT_LEVELS=[.382,.5,.618,.786]" v79/chart-visual-upgrades.js
          grep -F "const EXTENSION_LEVELS=[1.272,1.618,2]" v79/chart-visual-upgrades.js
          grep -F "RETR+EXT · 7 LEVELS" v79/chart-visual-upgrades.js
          grep -F "window.CryptoFibScaleLevels=fibScaleLevels" v79/chart-visual-upgrades.js
          grep -F "kind:'R'" v79/chart-visual-upgrades.js
          grep -F "kind:'E'" v79/chart-visual-upgrades.js
          grep -F "chartLeft=pad.l+2" v79/chart-visual-upgrades.js
          grep -F "ctx.lineTo(chartRight,yy)" v79/chart-visual-upgrades.js
          grep -F "#0ecb81" v79/chart-visual-upgrades.js
          grep -F "#f6465d" v79/chart-visual-upgrades.js
          grep -F "fibRatioLabel" v79/chart-visual-upgrades.js
          grep -F "EMA20" v79/chart-visual-upgrades.js
          grep -F "EMA50" v79/chart-visual-upgrades.js
          grep -F "EMA200" v79/chart-visual-upgrades.js
          grep -F "x0=pad.l+8" v79/chart-visual-upgrades.js
          grep -F "CryptoFibScaleLevels" v79/chart-fib-scale.js
          grep -F "...fibLevels" v79/chart-fib-scale.js
          grep -F "Coin Metrics" v79/chart-onchain.js
          grep -F "Blockchain.com" v79/chart-onchain.js
          grep -F "mempool.space" v79/chart-onchain.js
          grep -F "FALLBACK" v79/chart-onchain.js
          grep -F "data.degraded" v79/chart-onchain.js

      - name: Validate support and mobile shell
        run: |
          node --check v79/admin-support.js
          grep -F "crypto-lab-v79-support" v79/support.html
          grep -F "action:'admin_update'" v79/admin-support.js
          grep -F ".side:not(.open)" v79/platform.css
          grep -F "grid-template-columns:repeat(5" v79/platform.css
          grep -F "padding-bottom:calc(62px + var(--safe-bottom))" v79/platform.css
