name: Sync Protected Checkpoint 32 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-checkpoint-32-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind checkpoint 32 and self-delete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['updated_at']='2026-08-05T10:24:00Z'
          data['protected_checkpoint']=32
          data['protected_checkpoint_evidence']='docs/release-manifests/crypto-lab-v79-checkpoint-32.json'
          data['payment_activation_allowed']=False
          data['publication_allowed']=False
          operational=data.setdefault('operational_hardening',{})
          operational['protected_checkpoint']=32
          operational['protected_checkpoint_status']='protected'
          operational['protected_checkpoint_source_commit']='4bbced96ab09237d54dd2160ee92223017e11dab'
          operational['protected_checkpoint_evidence']='docs/release-manifests/crypto-lab-v79-checkpoint-32.json'
          operational['autonomous_cycle_enabled']=False
          operational['autonomous_cycle_pause_reason']='confirmed_overlapping_run_race'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v79-checkpoint-32-release-sync.yml
          git add docs/release-manifests/crypto-lab-v79-7930.json
          git commit -m 'Bind protected checkpoint 32 to release manifest'
          git push
