name: Final Candidate-only Manifest Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-final-candidate-only-manifest-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v79-final-candidate-only-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind final candidate-only migration history
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          additions=[
            {'version':'20260805093754','name':'enforce_fail_closed_owner_decision_constraints','source':'supabase/migrations/20260805093754_enforce_fail_closed_owner_decision_constraints.sql','source_commit':'2934cd36e26e448e0299e513f26a59c44966a9e8'},
            {'version':'20260805094250','name':'archive_and_block_payment_owner_decision_records','source':'supabase/migrations/20260805094250_archive_and_block_payment_owner_decision_records.sql','source_commit':'387b9f93e7104b136fd576498f082e369f7fc1db'},
            {'version':'20260805094607','name':'supersede_false_network_decision_denial_with_exact_owner_record','source':'supabase/migrations/20260805094607_supersede_false_network_decision_denial_with_exact_owner_record.sql','source_commit':'07dc878da30adeaa90ece6a7c15c8c70c82491cb'},
            {'version':'20260805094628','name':'restore_canonical_owner_three_network_authority','source':'supabase/migrations/20260805094628_restore_canonical_owner_three_network_authority.sql','source_commit':'2b5ff1105c9e1ff65f7d192e08a368b0bb31cede'},
            {'version':'20260805095124','name':'final_restore_candidate_only_after_false_owner_authority','source':'supabase/migrations/20260805095124_final_restore_candidate_only_after_false_owner_authority.sql','source_commit':'54861441ffbd1ff1ff2c4da053ecd42fc44948d3'},
          ]
          keyed={(m.get('version'),m.get('name')):m for m in manifest.setdefault('migrations',[])}
          for item in additions:
            key=(item['version'],item['name'])
            if key in keyed: keyed[key].update(item)
            else: manifest['migrations'].append(item)
          for item in manifest['migrations']:
            for extra in list(set(item)-{'version','name','source','source_commit'}):
              item.pop(extra,None)

          manifest['updated_at']='2026-08-05T09:59:00Z'
          manifest.setdefault('application',{})['evidence_commit']='73e4a24bf35e2b1c0c827f0fdd2e9d2e1a679b44'
          evidence=manifest.setdefault('release_evidence',{})
          allowed={'release_gate_run_id','maintenance_evidence_gate_run_id','browser_smoke_run_id','pages_run_id','technical_score','commercial_score'}
          for key in list(evidence):
            if key not in allowed: evidence.pop(key,None)
          evidence['release_gate_run_id']='pending'
          evidence['browser_smoke_run_id']='pending'
          evidence['pages_run_id']='pending'

          op=manifest.setdefault('operational_hardening',{})
          for key in list(op):
            if 'onchain' in key.lower() or 'owner_decision' in key.lower():
              op.pop(key,None)
          op.update({
            'onchain_payment_manifest':'docs/release-manifests/crypto-lab-v79-onchain-payments.json',
            'onchain_payment_sandbox_matrix':'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json',
            'onchain_provenance_repair_document':'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md',
            'onchain_authoritative_migration_version':'20260805095124',
            'onchain_authoritative_migration_name':'final_restore_candidate_only_after_false_owner_authority',
            'onchain_authoritative_migration_source_commit':'54861441ffbd1ff1ff2c4da053ecd42fc44948d3',
            'onchain_candidate_networks':['TRON','BSC','SOLANA'],
            'onchain_approved_network_count':0,
            'onchain_active_network_count':0,
            'onchain_selected_asset_count':0,
            'onchain_enabled_network_asset_count':0,
            'onchain_active_price_count':0,
            'onchain_receiving_address_count':0,
            'onchain_invoice_count':0,
            'onchain_chain_observation_count':0,
            'onchain_transaction_claim_count':0,
            'onchain_active_owner_decision_record_count':0,
            'onchain_invalid_owner_decision_record_archived':True,
            'onchain_invalid_owner_correction_archived':True,
            'onchain_owner_approval_recorded':False,
            'onchain_provider_decision_recorded':False,
            'onchain_owner_approval_fail_closed':True,
            'onchain_autonomous_owner_decision_insert_blocked':True,
            'onchain_validated_candidate_only_constraint_count':4,
            'onchain_transaction_lifecycle_hardened':True,
            'onchain_automatic_entitlement_prepared':True,
            'onchain_automatic_entitlement_enabled':False,
            'onchain_automatic_wallet_debit':False,
            'onchain_sandbox_scenario_count':27,
            'direct_onchain_payment_activation_allowed':False,
          })
          boundaries=manifest.setdefault('boundaries',{})
          boundaries['payment_provider_active']=False
          boundaries['paid_prices_active']=False
          boundaries['v79_published_over_v78']=False
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-final-candidate-only-manifest-sync-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-final-candidate-only-manifest-sync-once.yml
          git commit -m 'Bind final candidate-only payment evidence'
          git push
      - name: Dispatch final release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
