name: Finalize v79 Identity Payment Evidence Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-identity-payment-finalize-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind preparation evidence to release manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']='2026-08-05T08:47:00Z'
          manifest['application']['evidence_commit']='dcbb15236cee42d70d99fcfbe9794badd1f3b5d8'
          hardening=manifest.setdefault('operational_hardening',{})
          hardening.update({
            'turnstile_identity_plan_ready': True,
            'turnstile_production_keys_present': False,
            'turnstile_activation_allowed': False,
            'real_admin_runbook_ready': True,
            'real_admin_assigned': False,
            'payment_adapter_map_ready': True,
            'onchain_billing_schema_v2_draft_ready': True,
            'onchain_runtime_schema_migration_applied': False,
            'direct_onchain_payment_activation_allowed': False,
            'identity_payment_preparation_gate_run_id': '30990270213',
            'identity_plan_path': 'docs/release-manifests/crypto-lab-v79-identity-provisioning-plan.json',
            'payment_adapter_map_path': 'docs/release-manifests/crypto-lab-v79-payment-adapter-map.json',
            'billing_v2_draft_path': 'docs/schemas/crypto-billing-normalized-event-v2.draft.schema.json'
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm .github/workflows/v79-identity-payment-finalize-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-identity-payment-finalize-once.yml
          git commit -m 'Bind identity and payment preparation evidence'
          git push

      - name: Dispatch post-bind gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-identity-payment-preparation.yml --ref main
