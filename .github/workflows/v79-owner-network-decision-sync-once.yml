name: Sync Owner Network Decision Into v79 Evidence Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-owner-network-decision-sync-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize owner decision evidence
        run: |
          python - <<'PY'
          import json
          import pathlib

          root=pathlib.Path('.')
          decision_hash='57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be'
          approved=['TRON','BSC','SOLANA']
          migrations=[
            {
              'version':'20260805091915',
              'name':'guard_onchain_owner_decision_provenance',
              'source':'supabase/migrations/20260805091915_guard_onchain_owner_decision_provenance.sql',
              'source_commit':'10427e70736ec2113df2f5134e758a4a988daf78'
            },
            {
              'version':'20260805092040',
              'name':'clear_fabricated_onchain_owner_decision_timestamp',
              'source':'supabase/migrations/20260805092040_clear_fabricated_onchain_owner_decision_timestamp.sql',
              'source_commit':'f94bff87ec71cf9bd1d93b7ab5261602f1a85158'
            },
            {
              'version':'20260805092421',
              'name':'record_explicit_owner_three_network_decision',
              'source':'supabase/migrations/20260805092421_record_explicit_owner_three_network_decision.sql',
              'source_commit':'46c45e7013eaf48cd386883a2c577d5b2d6e802f'
            }
          ]

          onchain_path=root/'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
          onchain=json.loads(onchain_path.read_text(encoding='utf-8'))
          onchain['updated_at']='2026-08-05T09:28:00Z'
          onchain['provider']='onchain_direct'
          onchain['wallet_client']='trust_wallet_walletconnect'
          onchain['status']='disabled_pending_external_inputs'
          onchain['owner_approved_networks']=approved
          onchain['owner_network_approval_recorded']=True
          onchain.pop('provider_candidate',None)
          onchain.pop('wallet_client_candidate',None)
          onchain.pop('candidate_networks',None)
          for item in onchain.get('networks',[]):
            item['approved_by_owner']=item.get('code') in approved
            item['active']=False
          onchain['decision_provenance']={
            'decision_code':'ONCHAIN_THREE_NETWORK_SELECTION',
            'decision_text_exact':'Три сети утверждаю.',
            'decision_hash_sha256':decision_hash,
            'source_channel':'owner_chat',
            'original_message_timestamp_known':False,
            'database_record_migration_version':'20260805092421',
            'provenance_guard_migration_version':'20260805091915',
            'network_approval_recorded':True,
            'network_activation_authorized':False
          }
          keyed={(m.get('version'),m.get('name')):m for m in onchain.setdefault('migrations',[])}
          for migration in migrations:
            key=(migration['version'],migration['name'])
            if key in keyed:
              keyed[key].update(migration)
            else:
              onchain['migrations'].append(migration)
          required=[x for x in onchain.get('required_decisions',[]) if x not in {'PAYMENT_PROVIDER_RAIL','NETWORK_SELECTION'}]
          for item in [
            'SETTLEMENT_ASSET_USDT_OR_USDC',
            'BSC_PEGGED_USDT_ACCEPTANCE_IF_USDT',
            'BASIC_PRICING_MODE_AND_AMOUNT',
            'PRO_PRICING_MODE_AND_AMOUNT',
            'PUBLIC_RECEIVING_ADDRESS_FOR_EACH_APPROVED_NETWORK',
            'RPC_OR_INDEXER_CONFIGURATION',
            'WALLETCONNECT_PROJECT_ID',
            'CONTROLLED_SANDBOX_EVIDENCE',
            'PAYMENT_ACTIVATION_APPROVAL'
          ]:
            if item not in required:
              required.append(item)
          onchain['required_decisions']=required
          onchain['activation_allowed']=False
          onchain_path.write_text(json.dumps(onchain,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          matrix_path=root/'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['updated_at']='2026-08-05T09:28:00Z'
          matrix['provider']='onchain_direct'
          matrix['approved_networks']=approved
          matrix['owner_network_approval_recorded']=True
          matrix.pop('provider_candidate',None)
          matrix.pop('candidate_networks',None)
          if 'network_finality_candidates' in matrix:
            matrix['network_finality']=matrix.pop('network_finality_candidates')
          prerequisites=[x for x in matrix.get('prerequisites',[]) if x not in {'PAYMENT_PROVIDER_RAIL','NETWORK_SELECTION'}]
          for item in [
            'SETTLEMENT_ASSET_USDT_OR_USDC',
            'BSC_TOKEN_ACCEPTANCE_AND_CONTRACT_VERIFICATION',
            'BASIC_PRO_CRYPTO_PRICING',
            'THREE_PUBLIC_RECEIVING_ADDRESSES',
            'CHAIN_VERIFIER_CONFIGURATION',
            'WALLETCONNECT_PROJECT_ID',
            'REFUND_POLICY',
            'REAL_ADMIN'
          ]:
            if item not in prerequisites:
              prerequisites.append(item)
          matrix['prerequisites']=prerequisites
          matrix['decision_provenance']={
            'decision_code':'ONCHAIN_THREE_NETWORK_SELECTION',
            'decision_hash_sha256':decision_hash,
            'network_set_approved':True,
            'network_activation_authorized':False,
            'migration_version':'20260805092421'
          }
          matrix['mode']='disabled'
          matrix['activation_allowed']=False
          matrix_path.write_text(json.dumps(matrix,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          release_path=root/'docs/release-manifests/crypto-lab-v79-7930.json'
          release=json.loads(release_path.read_text(encoding='utf-8'))
          keyed={(m.get('version'),m.get('name')):m for m in release.setdefault('migrations',[])}
          for migration in migrations:
            key=(migration['version'],migration['name'])
            if key in keyed:
              keyed[key].update(migration)
            else:
              release['migrations'].append(migration)
          release['updated_at']='2026-08-05T09:28:00Z'
          release['application']['evidence_commit']='afdd6ae483e3981d8ad4ba83b0d6a309679cbcbd'
          release['release_evidence']['release_gate_run_id']='pending'
          release['release_evidence']['browser_smoke_run_id']='pending'
          release['release_evidence']['pages_run_id']='pending'
          operational=release.setdefault('operational_hardening',{})
          operational['onchain_payment_foundation']='three_network_owner_approved_disabled_pending_asset_pricing_addresses'
          operational['onchain_network_approval_recorded']=True
          operational['onchain_owner_decision_code']='ONCHAIN_THREE_NETWORK_SELECTION'
          operational['onchain_owner_decision_hash']=decision_hash
          operational['onchain_owner_decision_manifest']='docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
          operational['onchain_owner_decision_original_timestamp_known']=False
          operational['direct_onchain_payment_activation_allowed']=False
          operational['onchain_observation_lifecycle_hardened']=True
          release_path.write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/release-manifests/crypto-lab-v79-onchain-payments.json \
            docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json \
            docs/release-manifests/crypto-lab-v79-7930.json
          if git diff --cached --quiet; then
            echo 'Owner decision evidence already synchronized'
          else
            git commit -m 'Synchronize owner-approved three-network evidence'
            git push
          fi

      - name: Dispatch validation gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-owner-network-decision-validation.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-onchain-lifecycle-hardening-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
