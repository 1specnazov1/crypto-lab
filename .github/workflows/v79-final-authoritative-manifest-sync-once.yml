name: Final Authoritative Release Manifest Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-final-authoritative-manifest-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v79-final-authoritative-release-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind final authoritative payment recovery
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          additions=[
            {'version':'20260805100805','name':'final_lock_explicit_owner_three_network_selection','source':'supabase/migrations/20260805100805_final_lock_explicit_owner_three_network_selection.sql','source_commit':'4bbced96ab09237d54dd2160ee92223017e11dab'},
            {'version':'20260805101117','name':'explicit_deny_policies_for_service_only_audit_tables','source':'supabase/migrations/20260805101117_explicit_deny_policies_for_service_only_audit_tables.sql','source_commit':'fb5783add02ef266f6bc28e54ed5692f15422a47'},
            {'version':'20260805101600','name':'authoritative_candidate_only_recovery_after_100805','source':'supabase/migrations/20260805101600_authoritative_candidate_only_recovery_after_100805.sql','source_commit':'09dfd70b1ee55fc48023b019309e6e5f41798fc6'},
          ]
          keyed={(m.get('version'),m.get('name')):m for m in manifest.setdefault('migrations',[])}
          for item in additions:
            key=(item['version'],item['name'])
            if key in keyed: keyed[key].update(item)
            else: manifest['migrations'].append(item)
          for migration in manifest['migrations']:
            for key in list(migration):
              if key not in {'version','name','source','source_commit'}: migration.pop(key,None)

          manifest['updated_at']='2026-08-05T10:25:00Z'
          manifest.setdefault('application',{})['evidence_commit']='7b61972a1077cd5fe967ff3ae0c4a10444c769ce'
          release=manifest.setdefault('release_evidence',{})
          allowed={'release_gate_run_id','maintenance_evidence_gate_run_id','browser_smoke_run_id','pages_run_id','technical_score','commercial_score'}
          for key in list(release):
            if key not in allowed: release.pop(key,None)
          release['release_gate_run_id']='pending'
          release['browser_smoke_run_id']='pending'
          release['pages_run_id']='pending'

          op=manifest.setdefault('operational_hardening',{})
          for key in list(op):
            if 'onchain' in key.lower() or 'owner_decision' in key.lower() or 'authority_event' in key.lower():
              op.pop(key,None)
          op.update({
            'onchain_payment_manifest':'docs/release-manifests/crypto-lab-v79-onchain-payments.json',
            'onchain_payment_sandbox_matrix':'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json',
            'onchain_provenance_repair_document':'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md',
            'onchain_authoritative_migration_version':'20260805101600',
            'onchain_authoritative_migration_name':'authoritative_candidate_only_recovery_after_100805',
            'onchain_authoritative_migration_source_commit':'09dfd70b1ee55fc48023b019309e6e5f41798fc6',
            'onchain_last_false_authority_migration_version':'20260805100805',
            'onchain_last_false_authority_migration_superseded':True,
            'onchain_candidate_networks':['TRON','BSC','SOLANA'],
            'onchain_approved_network_count':0,
            'onchain_active_network_count':0,
            'onchain_selected_asset_count':0,
            'onchain_enabled_network_asset_count':0,
            'onchain_active_price_count':0,
            'onchain_receiving_address_count':0,
            'onchain_invoice_count':0,
            'onchain_chain_observation_count':0,
            'onchain_transaction_claim_count':0,
            'onchain_active_owner_decision_record_count':0,
            'onchain_effective_payment_authority_event_count':0,
            'onchain_owner_approval_recorded':False,
            'onchain_provider_decision_recorded':False,
            'onchain_owner_approval_fail_closed':True,
            'onchain_owner_record_write_blocked':True,
            'onchain_authority_event_write_blocked':True,
            'onchain_validated_candidate_only_constraint_count':5,
            'onchain_transaction_lifecycle_hardened':True,
            'onchain_automatic_entitlement_prepared':True,
            'onchain_automatic_entitlement_enabled':False,
            'onchain_automatic_wallet_debit':False,
            'onchain_sandbox_scenario_count':30,
            'direct_onchain_payment_activation_allowed':False,
            'security_advisor_lints':0,
            'service_only_audit_tables_explicit_deny_policies':True,
            'service_only_audit_policy_migration_version':'20260805101117',
          })
          boundaries=manifest.setdefault('boundaries',{})
          boundaries['payment_provider_active']=False
          boundaries['paid_prices_active']=False
          boundaries['v79_published_over_v78']=False
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-final-authoritative-manifest-sync-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-final-authoritative-manifest-sync-once.yml
          git commit -m 'Bind final authoritative payment recovery'
          git push
      - name: Dispatch final validation gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
