name: Validate v79 Preview

on:
  push:
    paths:
      - 'v79/**'
      - 'tests/v79-mobile-smoke.spec.js'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'docs/schemas/crypto-billing-normalized-event-v1.schema.json'
      - 'docs/release-manifests/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v79-preview-validation.yml'
  pull_request:
    paths:
      - 'v79/**'
      - 'tests/v79-mobile-smoke.spec.js'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'docs/schemas/crypto-billing-normalized-event-v1.schema.json'
      - 'docs/release-manifests/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v79-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Extract inline scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          output=Path('/tmp/v79-inline');output.mkdir(parents=True,exist_ok=True)
          pattern=re.compile(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',re.S|re.I)
          count=0
          for html in sorted(Path('v79').glob('*.html')):
              for index,script in enumerate(pattern.findall(html.read_text(encoding='utf-8')),start=1):
                  if script.strip():
                      (output/f'{html.stem}-{index}.js').write_text(script,encoding='utf-8');count+=1
          print(f'Extracted {count} inline scripts')
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find v79 -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find /tmp/v79-inline -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check tests/v79-mobile-smoke.spec.js
          node --check playwright.config.mjs

      - name: Validate JSON assets
        run: |
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));if(p.version!=='79.30.0')throw new Error('package version mismatch')"
          node -e "JSON.parse(require('fs').readFileSync('v79/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/schemas/crypto-billing-normalized-event-v1.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/release-manifests/crypto-lab-v79-7930.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/release-manifests/crypto-lab-v79-7930-hotfix-overlay.json','utf8'))"

      - name: Apply audited hotfix overlay to CI manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base_path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          overlay_path=Path('docs/release-manifests/crypto-lab-v79-7930-hotfix-overlay.json')
          base=json.loads(base_path.read_text(encoding='utf-8'))
          overlay=json.loads(overlay_path.read_text(encoding='utf-8'))
          assert overlay.get('schema_version') == 1
          assert overlay.get('build') == base.get('build') == '7930'
          boundaries=overlay.get('boundaries',{})
          assert boundaries.get('v79_published_over_v78') is False
          assert boundaries.get('payment_activation_changed') is False
          assert boundaries.get('registration_activation_changed') is True
          reason=overlay.get('reason','').lower()
          assert 'public free' in reason
          application=base.setdefault('application',{})
          application['pwa_cache']=overlay['pwa_cache']
          overrides=overlay.get('asset_overrides',{})
          seen=set()
          for asset in application.get('assets',[]):
              path=asset.get('path')
              if path in overrides:
                  asset.update(overrides[path]);seen.add(path)
          missing=set(overrides)-seen
          if missing:
              raise SystemExit(f'overlay references assets absent from base manifest: {sorted(missing)}')
          base_path.write_text(json.dumps(base,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Applied owner-authorized PUBLIC FREE v79 overlay for CI validation only')
          PY

      - name: Validate release gate and drift manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,sys
          root=Path('v79');errors=[]
          required_files=[
            'index.html','app.html','app.css','app.js','public-free-home.js','app-extension.js','support-extension.js','commercial-extension.js',
            'accessibility.js','module-accessibility.js','platform.css','module-mobile.css','manifest.webmanifest','icon.svg','offline.html',
            'chart.html','portfolio.html','calculator.html','backtest.html','backtest-history.js','scanner.html','scanner-actions.js','ai.html',
            'journal.html','journal.js','journal-import.js','journal-analytics.js','account.html','account-actions.js','session-security.js','free-access-ui.js',
            'registration-consent.js','auth-gateway.js','recovery.html','commercial.js','subscription-lifecycle.js','support.html','admin.html','admin-health.js','admin-incidents.js',
            'admin-slo.js','admin-ops-summary.js','admin-integrity.js','admin-drift.js','admin-deletions.js','admin-support.js','admin-commercial.js',
            'admin-billing-events.js','admin-provider-readiness.js','admin-audit.js','admin-session-security.js','admin-readiness.js',
            'admin-telemetry.js','admin-ai-telemetry.js','legal.js','privacy.html','terms.html','risk-disclosure.html','service-worker.js'
          ]
          for name in required_files:
              if not (root/name).is_file():errors.append(f'missing required file: v79/{name}')
          for path in ['tests/v79-mobile-smoke.spec.js','playwright.config.mjs','docs/release-manifests/crypto-lab-v79-7930.json']:
              if not Path(path).is_file():errors.append(f'missing required file: {path}')

          def read(name):
              path=root/name
              return path.read_text(encoding='utf-8') if path.exists() else ''
          index,app,commercial,worker=map(read,['index.html','app.html','commercial-extension.js','service-worker.js'])
          match=re.search(r'app\.html\?v=(\d{4,})',index);build=match.group(1) if match else None
          if not build:errors.append('index.html does not declare numeric v79 build')
          if build:
              if f'commercial-extension.js?v={build}' not in app:errors.append(f'app.html commercial build mismatch {build}')
              if not re.search(rf"\bBUILD\s*=\s*['\"]{re.escape(build)}['\"]",commercial):errors.append(f'commercial-extension BUILD mismatch {build}')
              if f'crypto-lab-v79-{build}' not in worker and f'crypto-lab-v79-{build}-pwa1' not in worker:errors.append(f'service-worker build mismatch {build}')

          markers={
            'commercial-extension.js':['adminOperationalSummaryScript','adminDataIntegrityScript','adminReleaseDriftScript','admin-drift.js','publicFreeAccessScript'],
            'admin-drift.js':['get_crypto_admin_release_drift','get_crypto_admin_rollback_readiness','releaseDriftPanel'],
            'admin-integrity.js':['get_crypto_admin_data_integrity','dataIntegrityPanel'],
            'admin-ops-summary.js':['get_crypto_admin_operational_summary','operationalSummary'],
            'service-worker.js':['public-free-home.js','free-access-ui.js','recovery.html','admin-drift.js','admin-integrity.js','admin-ops-summary.js','CLEAR_OLD_CACHES','ignoreSearch:true'],
            'app.html':['Content-Security-Policy','public-free-home.js?v=7930free1','commercial-extension.js?v=7930','accessibility.js?v=7930','PUBLIC FREE'],
            'manifest.webmanifest':['"display": "standalone"','icon.svg']
          }
          for name,items in markers.items():
              text=read(name)
              for marker in items:
                  if marker not in text:errors.append(f'v79/{name}: missing marker {marker!r}')

          attr_pattern=re.compile(r'(?:src|href)=["\'](\./[^"\']+)["\']',re.I)
          for html in root.glob('*.html'):
              for ref in attr_pattern.findall(html.read_text(encoding='utf-8')):
                  clean=ref.split('?',1)[0].split('#',1)[0]
                  if clean not in ('./','') and not (root/clean[2:]).exists():errors.append(f'{html}: missing local reference {ref}')
          shell_match=re.search(r'const\s+SHELL\s*=\s*\[(.*?)\];',worker,re.S)
          if not shell_match:errors.append('service-worker SHELL list not found')
          else:
              shell_refs=set(re.findall(r"['\"](\./[^'\"]+)['\"]",shell_match.group(1)))
              for ref in shell_refs:
                  clean=ref.split('?',1)[0].split('#',1)[0]
                  if clean!='./' and not (root/clean[2:]).exists():errors.append(f'service-worker missing cached file {ref}')
              for required in ['./admin-drift.js','./admin-integrity.js','./admin-ops-summary.js','./session-security.js','./public-free-home.js','./free-access-ui.js','./recovery.html']:
                  if required not in shell_refs:errors.append(f'service-worker security/free asset not cached {required}')

          forbidden=['SUPABASE_SERVICE_ROLE_KEY','MONITOR_SECRET','TELEGRAM_BOT_TOKEN','OPENAI_API_KEY','RESEND_API_KEY','CRYPTO_BILLING_WEBHOOK_SECRET','CRYPTO_TURNSTILE_SECRET_KEY','LIQPAY_PRIVATE_KEY','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','CRYPTO_MAIL_RELAY_PUBLISHABLE_KEY','sb_secret_']
          for path in root.iterdir():
              if path.is_file() and path.suffix.lower() in {'.html','.js','.css','.json','.webmanifest','.svg'}:
                  text=path.read_text(encoding='utf-8')
                  for marker in forbidden:
                      if marker in text:errors.append(f'{path}: forbidden server-secret marker {marker}')

          manifest=json.loads(Path('docs/release-manifests/crypto-lab-v79-7930.json').read_text(encoding='utf-8'))
          if manifest.get('build')!=build:errors.append('release manifest build mismatch')
          if manifest.get('project_ref')!='txhzxbizjpinowepfjkm':errors.append('release manifest project mismatch')
          def blob_sha(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          stable=manifest.get('stable_root',{})
          if blob_sha(stable.get('path','index.html'))!=stable.get('sha'):errors.append('stable root SHA drift')
          application=manifest.get('application',{})
          if application.get('pwa_cache') not in worker:errors.append('PWA cache does not match release manifest')
          seen=set()
          for asset in application.get('assets',[]):
              path=asset.get('path');sha=asset.get('sha');marker=asset.get('marker','')
              if not path or path in seen:errors.append(f'invalid or duplicate manifest asset {path!r}');continue
              seen.add(path)
              if not Path(path).is_file():errors.append(f'manifest asset missing {path}');continue
              if blob_sha(path)!=sha:errors.append(f'manifest asset SHA drift {path}')
              if marker and marker not in Path(path).read_text(encoding='utf-8'):errors.append(f'manifest asset marker drift {path}')
          migration_seen=set()
          for migration in manifest.get('migrations',[]):
              key=(migration.get('version'),migration.get('name'))
              if key in migration_seen:errors.append(f'duplicate manifest migration {key}')
              migration_seen.add(key)
              source=migration.get('source')
              if source and not Path(source).is_file():errors.append(f'manifest migration source missing {source}')
          edge_slugs=[item.get('slug') for item in manifest.get('edge_functions',[])]
          if len(edge_slugs)!=len(set(edge_slugs)):errors.append('duplicate edge function in manifest')
          if len(edge_slugs)<20:errors.append('release manifest edge inventory incomplete')
          if manifest.get('boundaries',{}).get('v79_published_over_v78') is not False:errors.append('release manifest root boundary invalid')

          webmanifest=json.loads(read('manifest.webmanifest'))
          if webmanifest.get('display')!='standalone' or not webmanifest.get('icons'):errors.append('invalid PWA manifest')
          schema=json.loads(Path('docs/schemas/crypto-billing-normalized-event-v1.schema.json').read_text(encoding='utf-8'))
          if schema.get('title')!='CRYPTO LAB Normalized Billing Event v1':errors.append('normalized billing schema title mismatch')
          if errors:
              print('\n'.join(f'ERROR: {item}' for item in errors));sys.exit(1)
          print(f'v79 PUBLIC FREE release and drift gate passed for build {build}')
          PY
