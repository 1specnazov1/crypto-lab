name: Validate v79 Preview

on:
  push:
    paths:
      - 'v79/**'
      - '.github/workflows/v79-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract inline scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          output = Path('/tmp/v79-inline')
          output.mkdir(parents=True, exist_ok=True)
          count = 0
          pattern = re.compile(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', re.S | re.I)
          for html in sorted(Path('v79').glob('*.html')):
              text = html.read_text(encoding='utf-8')
              for index, script in enumerate(pattern.findall(text), start=1):
                  if not script.strip():
                      continue
                  target = output / f'{html.stem}-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  print(target)
                  count += 1
          if count == 0:
              raise SystemExit('No inline scripts found')
          PY

      - name: Check JavaScript syntax
        run: |
          find v79 -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find /tmp/v79-inline -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('v79/manifest.webmanifest','utf8'))"

      - name: Validate required modules and safety markers
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'v79/index.html': ['app.html?v=7907'],
              'v79/app.html': ['app-extension.js?v=7907', 'viewport-fit=cover'],
              'v79/app.js': ["['backtest','↺']", "['ai','✦']", "['journal','☷']"],
              'v79/app-extension.js': ['scanner.html', 'scanner-actions.js', 'journal-import.js', 'ai.html', 'backtest.html', 'journal.html', 'account.html', 'service-worker.js', "BUILD = '7907'"],
              'v79/backtest.html': ['crypto-lab-v79-backtest-data', 'get_crypto_feature_status', 'Profit Factor'],
              'v79/scanner.html': ['crypto-lab-v79-scanner', 'Проверка доступа'],
              'v79/scanner-actions.js': ['В журнал', 'sourceSignal', 'route'],
              'v79/ai.html': ['crypto-ai-advisor', 'get_crypto_feature_status'],
              'v79/journal.html': ['journal.js?v=7906', 'Журнал сделок', 'Profit Factor'],
              'v79/journal.js': ['crypto_trade_journal', 'realized_pnl', 'r_multiple', 'persistSession'],
              'v79/journal-import.js': ['import_fingerprint', 'SHA-256', 'crypto_trade_journal', 'MAX_ROWS'],
              'v79/account.html': ['get_my_crypto_account'],
              'v79/manifest.webmanifest': ['"display": "standalone"', 'icon.svg'],
              'v79/service-worker.js': ['crypto-lab-v79-7907', 'scanner-actions.js', 'journal-import.js', 'offline.html'],
              'v79/privacy.html': ['Уведомление о конфиденциальности'],
              'v79/terms.html': ['Условия использования'],
              'v79/risk-disclosure.html': ['Раскрытие рисков'],
              'v79/chart.html': ['EMA20', 'RSI14'],
              'v79/portfolio.html': ['portfolio'],
              'v79/calculator.html': ['calculator'],
          }
          forbidden = ['SUPABASE_SERVICE_ROLE_KEY', 'MONITOR_SECRET', 'TELEGRAM_BOT_TOKEN', 'OPENAI_API_KEY=']
          for filename, markers in required.items():
              text = Path(filename).read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{filename}: missing {missing}')
              leaked = [item for item in forbidden if item in text]
              if leaked:
                  raise SystemExit(f'{filename}: forbidden secret marker {leaked}')
          print('v79 validation passed')
          PY
