name: Finalize v79 Maintenance Passed Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-maintenance-passed-finalize-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finalize verified maintenance release evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json
          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          manifest['application']['evidence_commit']='798014179955856dbde7824e4b2f48265cb2416b'
          manifest['release_evidence']={
            'release_gate_run_id':'30973212106',
            'maintenance_evidence_gate_run_id':'30973213044',
            'browser_smoke_run_id':'30933361064',
            'pages_run_id':'30973211721',
            'technical_score':100,
            'commercial_score':60
          }
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit finalized maintenance release
        run: |
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/v79-maintenance-passed-finalize-once.yml
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-maintenance-passed-finalize-once.yml
          git commit -m 'Finalize verified maintenance evidence release'
          git push
      - name: Dispatch post-manifest gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-maintenance-evidence-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
