name: Validate v79 Owner Decision Fail-closed Boundary
on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-7930.json'
      - 'supabase/migrations/20260805105743_restore_exact_owner_three_network_authority_after_104812_stale_cycle.sql'
      - 'scripts/v79_validate_onchain_foundation.py'
      - '.github/workflows/v79-owner-decision-failclosed-validation.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/v79_validate_onchain_foundation.py
      - name: Reject activation by the network-selection decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          owner=json.loads(Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').read_text())
          assert owner['decision_scope']=='network_selection_only'
          assert owner['activation_allowed'] is False and owner['publication_allowed'] is False
          assert owner['settlement_asset']=='pending'
          assert all(owner[k] is False for k in ['checkout_enabled','webhook_enabled','recurring_enabled','refunds_enabled'])
          print('Owner decision remains network-selection-only and fail-closed: OK')
          PY
