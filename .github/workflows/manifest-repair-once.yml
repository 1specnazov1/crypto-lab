name: Repair release manifest once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manifest-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair canonical manifest fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('docs/release-manifests/crypto-lab-v79-7930.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          data['application']['application_commit'] = '6be2e93d3933ef6339b059978e24af891ef1fa83'
          for asset in data['application']['assets']:
              if 'markey' in asset and 'marker' not in asset:
                  asset['marker'] = asset.pop('markey')
              if 'marker' not in asset:
                  raise SystemExit(f"asset marker missing: {asset.get('path')}")

          data['updated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit repaired manifest and remove one-shot workflow
        run: |
          git config user.name "CRYPTO LAB Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/manifest-repair-once.yml
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/manifest-repair-once.yml
          git commit -m "Repair release manifest canonical metadata"
          git push