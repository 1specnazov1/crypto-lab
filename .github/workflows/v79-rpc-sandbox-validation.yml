name: Validate v79 RPC Sandbox

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-rpc-sandbox.json'
      - 'docs/commercial-readiness/2026-08-06-1900-testnet-payment-contour.md'
      - 'supabase/migrations/20260805204216_prepare_multichain_rpc_verifier_and_isolated_sandbox.sql'
      - 'supabase/migrations/20260805204521_index_multichain_sandbox_profile_fk.sql'
      - 'supabase/migrations/20260805210454_configure_publicnode_ethereum_sepolia_sandbox.sql'
      - 'supabase/migrations/20260805211218_prepare_owner_scoped_usdc_sandbox_transfer_decision.sql'
      - 'supabase/migrations/20260806053020_record_scoped_usdc_sandbox_transfer_approval.sql'
      - 'supabase/migrations/20260806053053_finalize_scoped_usdc_sandbox_approval_evidence.sql'
      - 'supabase/migrations/20260806055345_register_ethereum_sepolia_test_sender.sql'
      - 'supabase/migrations/20260806070941_register_solana_devnet_test_sender.sql'
      - 'supabase/migrations/20260806071522_record_solana_devnet_airdrop_attempt.sql'
      - 'supabase/migrations/20260806144638_record_testnet_funding_route_audit.sql'
      - 'supabase/migrations/20260806160423_complete_testnet_payment_contour_fixture_v1.sql'
      - 'supabase/migrations/20260806170016_finalize_testnet_payment_contour_live_probe_v1.sql'
      - 'supabase/functions/crypto-lab-v79-chain-verifier/**'
      - 'scripts/v79_validate_rpc_sandbox.py'
      - '.github/workflows/v79-rpc-sandbox-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-rpc-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate existing on-chain foundation
        run: python scripts/v79_validate_onchain_foundation.py
      - name: Validate registered senders and funding watch
        run: python scripts/v79_validate_rpc_sandbox.py
      - name: Type-check chain verifier and fixtures
        run: |
          deno check --config supabase/functions/crypto-lab-v79-chain-verifier/deno.json \
            supabase/functions/crypto-lab-v79-chain-verifier/index.ts \
            supabase/functions/crypto-lab-v79-chain-verifier/index_test.ts
      - name: Run wallet-free parser fixture tests
        run: deno test --config supabase/functions/crypto-lab-v79-chain-verifier/deno.json supabase/functions/crypto-lab-v79-chain-verifier/index_test.ts
      - name: Preserve immutable public boundaries
        run: |
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/service-worker.js)" = "33bfb7856afa2c49d870fb3607f8bb1279e47f32"
