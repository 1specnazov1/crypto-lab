name: Validate v79 Commercial Landing Contract

on:
  push:
    branches: [main]
    paths:
      - 'v79/commercial-preview.html'
      - 'v79/commercial-preview.js'
      - '.github/workflows/v79-commercial-landing-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pricing and disabled launch boundary
        run: |
          grep -F '$20' v79/commercial-preview.html
          grep -F '$49' v79/commercial-preview.html
          grep -F 'ПЛАТЕЖИ ВЫКЛЮЧЕНЫ' v79/commercial-preview.js
          grep -F 'PAYMENTS DISABLED' v79/commercial-preview.js
          grep -F 'не принимает оплату' v79/commercial-preview.js
          grep -F 'does not accept payment' v79/commercial-preview.js
          if grep -E '0x[a-fA-F0-9]{40}|[1-9A-HJ-NP-Za-km-z]{40,}' v79/commercial-preview.html; then
            echo 'Landing must not embed payment/wallet addresses' >&2
            exit 1
          fi
      - name: Validate legal and risk surfaces
        run: |
          grep -F './terms.html' v79/commercial-preview.html
          grep -F './privacy.html' v79/commercial-preview.html
          grep -F './refund.html' v79/commercial-preview.html
          grep -F './risk-disclosure.html' v79/commercial-preview.html
          grep -F 'не является гарантией прибыли' v79/commercial-preview.js
          grep -F 'does not guarantee profit' v79/commercial-preview.js
      - name: Validate local-only referral preview
        run: |
          grep -F 'sessionStorage.setItem' v79/commercial-preview.js
          if grep -E 'fetch\(|XMLHttpRequest|sendBeacon' v79/commercial-preview.js; then
            echo 'Commercial preview must not transmit attribution before activation' >&2
            exit 1
          fi
