name: V79 Owner Launch Smoke

on:
  push:
    branches: [main]
    paths:
      - 'tests/v79-owner-launch-smoke.spec.js'
      - 'tests/v79-backtest-run-smoke.spec.js'
      - 'playwright.owner-launch.config.mjs'
      - 'v79/app.html'
      - 'v79/app.js'
      - 'v79/app-extension.js'
      - 'v79/commercial-extension.js'
      - 'v79/registration-consent.js'
      - 'v79/auth-gateway.js'
      - 'v79/account.html'
      - 'v79/account-actions.js'
      - 'v79/chart.html'
      - 'v79/scanner.html'
      - 'v79/ai.html'
      - 'v79/portfolio.html'
      - 'v79/journal.html'
      - 'v79/backtest.html'
      - 'v79/backtest-history.js'
      - 'v79/backtest-run-guard.js'
      - '.github/workflows/v79-owner-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-owner-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Install Playwright ffmpeg runtime
        run: npx playwright install ffmpeg

      - name: Validate preinstalled Chrome
        run: |
          command -v google-chrome
          google-chrome --version

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v79-owner-launch-http.log 2>&1 &
          echo $! >/tmp/v79-owner-launch-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/v79/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v79-owner-launch-http.log
          exit 1

      - name: Run required owner launch path
        env:
          CI: 'true'
        run: npx playwright test --config=playwright.owner-launch.config.mjs

      - name: Upload owner launch evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v79-owner-launch-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
