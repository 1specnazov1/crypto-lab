name: V79 Owner Launch Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-owner-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-owner-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v79-owner-launch-http.log 2>&1 &
          echo $! >/tmp/v79-owner-launch-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/v79/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v79-owner-launch-http.log
          exit 1

      - name: Run required owner launch path
        run: >-
          npx playwright test tests/v79-mobile-smoke.spec.js
          --config=playwright.config.mjs
          --project=desktop-chromium
          --workers=1
          --grep "v79 owner launch path|account logout and repeated login"

      - name: Upload owner launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v79-owner-launch-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
