name: Strict Manifest Top-level Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-manifest-top-level-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove duplicate top-level boundary fields
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          for key in ['payment_activation_allowed','publication_allowed','stable_root_v78_sha']:
            manifest.pop(key,None)
          manifest['updated_at']='2026-08-05T10:27:00Z'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-manifest-top-level-repair-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-manifest-top-level-repair-once.yml
          git commit -m 'Restore strict release manifest top-level contract'
          git push
      - name: Dispatch strict contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
