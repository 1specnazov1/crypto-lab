name: Finalize v79 Authoritative Manifest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-final-authority-sync-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update authoritative release evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']='2026-08-05T10:30:00Z'
          manifest['application']['evidence_commit']=os.environ['GITHUB_SHA']
          manifest['boundaries'].update({
            'registration_enabled':False,
            'recovery_enabled':False,
            'paid_prices_active':False,
            'payment_provider_active':False,
            'v79_published_over_v78':False
          })
          evidence=manifest['release_evidence']
          evidence['release_gate_run_id']='30996209180'
          evidence['browser_smoke_run_id']='30996210610'
          evidence['pages_run_id']='30996202623'

          key=('20260805101600','authoritative_candidate_only_recovery_after_100805')
          seen={(str(x.get('version')),str(x.get('name'))) for x in manifest.get('migrations',[])}
          if key not in seen:
            manifest.setdefault('migrations',[]).append({
              'version':key[0],
              'name':key[1],
              'source':'supabase/migrations/20260805101600_authoritative_candidate_only_recovery_after_100805.sql',
              'source_commit':'09dfd70b1ee55fc48023b019309e6e5f41798fc6'
            })

          hardening=manifest.setdefault('operational_hardening',{})
          hardening.update({
            'authoritative_payment_recovery_migration':'20260805101600',
            'authoritative_payment_recovery_source_commit':'09dfd70b1ee55fc48023b019309e6e5f41798fc6',
            'payment_provider_status':'decision_required',
            'onchain_provider_selected':False,
            'onchain_approved_network_count':0,
            'onchain_active_network_count':0,
            'onchain_selected_asset_count':0,
            'onchain_enabled_network_asset_count':0,
            'onchain_active_price_count':0,
            'onchain_receiving_address_count':0,
            'onchain_invoice_count':0,
            'onchain_observation_count':0,
            'onchain_credited_claim_count':0,
            'active_valid_owner_decision_records':0,
            'superseded_invalid_owner_decision_records':1,
            'owner_decision_constraints_validated':True,
            'owner_decision_negative_probes_passed':True,
            'fabricated_owner_text_not_user_content':True,
            'overlapping_recurring_automation_disabled':True,
            'self_rewriting_owner_decision_workflows_removed':True,
            'onchain_payment_activation_allowed':False,
            'automatic_wallet_debit':False,
            'crypto_x_live_publish_enabled':False,
            'registration_enabled':False,
            'recovery_enabled':False,
            'v79_publication_authorized':False,
            'onchain_manifest_schema_version':12,
            'payment_sandbox_matrix_schema_version':9
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-final-authority-sync-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-final-authority-sync-once.yml
          git commit -m 'Finalize authoritative candidate-only release manifest'
          git push
