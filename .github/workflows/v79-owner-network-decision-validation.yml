name: Validate v79 Owner Network Decision Evidence

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805093151_enforce_recorded_owner_three_network_decision.sql'
      - '.github/workflows/v79-owner-network-decision-validation.yml'
  pull_request:
    paths:
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805093151_enforce_recorded_owner_three_network_decision.sql'
      - '.github/workflows/v79-owner-network-decision-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-owner-network-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate exact decision and disabled runtime boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root=pathlib.Path('.')
          decision_path=root/'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
          onchain_path=root/'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
          matrix_path=root/'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
          migration_path=root/'supabase/migrations/20260805093151_enforce_recorded_owner_three_network_decision.sql'
          repair_path=root/'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
          decision=json.loads(decision_path.read_text(encoding='utf-8'))
          onchain=json.loads(onchain_path.read_text(encoding='utf-8'))
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          migration=migration_path.read_text(encoding='utf-8')
          repair=repair_path.read_text(encoding='utf-8')
          errors=[]

          exact='Три сети утверждаю.'
          expected_hash=hashlib.sha256(exact.encode('utf-8')).hexdigest()
          approved=['TRON','BSC','SOLANA']

          if expected_hash!='57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be': errors.append('hash fixture')
          if decision.get('decision_text_exact')!=exact: errors.append('decision text')
          if decision.get('decision_hash_sha256')!=expected_hash: errors.append('decision hash')
          if decision.get('decision_code')!='ONCHAIN_THREE_NETWORK_SELECTION': errors.append('decision code')
          if decision.get('source_channel')!='owner_chat': errors.append('source channel')
          if decision.get('original_message_timestamp_known') is not False: errors.append('timestamp provenance')

          networks=decision.get('approved_networks',[])
          if [n.get('network_code') for n in networks]!=approved: errors.append('approved network order')
          if [n.get('token_standard') for n in networks]!=['TRC20','BEP20','SPL']: errors.append('network standards')
          if any(n.get('approved_by_owner') is not True or n.get('active') is not False for n in networks): errors.append('network approval/activation')

          scope=decision.get('scope',{})
          if scope.get('network_set_approved') is not True: errors.append('network set approval')
          for key in ('network_activation_authorized','settlement_asset_selected','pricing_selected','receiving_addresses_configured','real_money_testing_authorized','v79_publication_authorized'):
            if scope.get(key) is not False: errors.append(key)

          db=decision.get('database',{})
          expected_db={
            'authoritative_migration_version':'20260805093151',
            'authoritative_migration_name':'enforce_recorded_owner_three_network_decision',
            'authoritative_migration_source':str(migration_path),
            'authoritative_migration_source_commit':'9c0a335a1ad0817857f183c99c3a39ee491f62d0',
            'decision_record_immutable':True,
            'decision_table_rls':True,
            'browser_table_grants':0,
            'silent_approval_removal_blocked':True,
            'silent_requirement_reversion_blocked':True,
            'owner_decision_integrity_state':'healthy',
            'owner_decision_integrity_checks':5
          }
          for key,value in expected_db.items():
            if db.get(key)!=value: errors.append(f'database {key}')

          runtime=decision.get('runtime_state',{})
          if runtime.get('approved_network_count')!=3: errors.append('approved network count')
          for key in ('active_network_count','selected_asset_count','active_price_count','receiving_address_count','invoice_count','chain_observation_count','auth_user_count','registration_attempt_count','recovery_attempt_count'):
            if runtime.get(key)!=0: errors.append(f'runtime {key}')
          if runtime.get('provider_desired_mode')!='disabled' or runtime.get('provider_lifecycle_status')!='draft': errors.append('provider state')
          for key in ('checkout_enabled','webhook_enabled','recurring_enabled','refunds_enabled'):
            if runtime.get(key) is not False: errors.append(f'runtime {key}')

          if onchain.get('approved_networks')!=approved or onchain.get('owner_network_approval_recorded') is not True: errors.append('on-chain manifest decision')
          if onchain.get('activation_allowed') is not False or onchain.get('publication_allowed') is not False: errors.append('on-chain activation boundary')
          if any(n.get('approved_by_owner') is not True or n.get('active') is not False for n in onchain.get('networks',[])): errors.append('on-chain network state')
          if matrix.get('approved_networks')!=approved or matrix.get('owner_network_approval_recorded') is not True: errors.append('matrix decision')
          if matrix.get('mode')!='disabled' or matrix.get('activation_allowed') is not False: errors.append('matrix activation boundary')

          required_markers=[
            'crypto_owner_decision_records',exact,expected_hash,'ONCHAIN_THREE_NETWORK_SELECTION',
            'enforce_crypto_onchain_owner_decision_record','enforce_crypto_payment_owner_decision_record',
            'crypto_owner_decision_integrity_snapshot','Recorded owner network approval cannot be removed',
            "status='inactive'","'network_activation',false","'activation',false"
          ]
          for marker in required_markers:
            if marker not in migration: errors.append(f'migration marker {marker}')

          stale_false=[
            'The user did **not** write `Три сети утверждаю.`',
            'No such network-selection decision existed in the conversation',
            'fabricated_decision_text',
            'candidate_networks',
            'owner_network_approval_recorded": false'
          ]
          combined=decision_path.read_text(encoding='utf-8')+'\n'+onchain_path.read_text(encoding='utf-8')+'\n'+matrix_path.read_text(encoding='utf-8')+'\n'+repair
          for marker in stale_false:
            if marker in combined: errors.append(f'stale false evidence {marker}')

          for pattern in [
            r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',r'\bsb_secret_[A-Za-z0-9_-]{12,}',
            r'\bsk_live_[A-Za-z0-9_-]+',r'\bsk_test_[A-Za-z0-9_-]+',r'\bwhsec_[A-Za-z0-9_-]+',
            r'postgres(?:ql)?://[^\s]+:[^\s]+@',r'\b(?:seed phrase|mnemonic)\s*:'
          ]:
            if re.search(pattern,combined+'\n'+migration,re.I): errors.append(f'forbidden material {pattern}')

          if decision.get('activation_allowed') is not False or decision.get('publication_allowed') is not False: errors.append('decision boundary')
          if decision.get('stable_root_v78_sha')!='4a278c891d37b3760ec1ac988690ea9ad587b24e': errors.append('v78 boundary')
          if decision.get('public_application_commit')!='e1cbe2eb1cb9d97295ecfc9836d0f9bac9cfc191': errors.append('v79 app boundary')
          if decision.get('pwa_cache')!='crypto-lab-v79-7930-auth1': errors.append('PWA boundary')

          if errors:
            print('\n'.join('ERROR: '+e for e in errors))
            sys.exit(1)
          print('Final immutable owner network decision evidence: OK')
          PY

      - name: Preserve stable v78 and v79 public assets
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
          test "$(git hash-object v79/commercial-extension.js)" = "9d300dd2276e55ffc4ad1b8fcb60766046bba8f6"
          test "$(git hash-object v79/service-worker.js)" = "33bfb7856afa2c49d870fb3607f8bb1279e47f32"
          grep -F 'crypto-lab-v79-7930-auth1' v79/service-worker.js >/dev/null
