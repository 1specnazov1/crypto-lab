name: Validate v79 Owner Network Decision Evidence

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805092421_record_explicit_owner_three_network_decision.sql'
      - '.github/workflows/v79-owner-network-decision-validation.yml'
  pull_request:
    paths:
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805092421_record_explicit_owner_three_network_decision.sql'
      - '.github/workflows/v79-owner-network-decision-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-owner-network-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate exact decision provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root=pathlib.Path('.')
          manifest_path=root/'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
          migration_path=root/'supabase/migrations/20260805092421_record_explicit_owner_three_network_decision.sql'
          repair_path=root/'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          migration=migration_path.read_text(encoding='utf-8')
          repair=repair_path.read_text(encoding='utf-8')
          errors=[]

          exact='Три сети утверждаю.'
          expected_hash=hashlib.sha256(exact.encode('utf-8')).hexdigest()
          if expected_hash!='57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be':
            errors.append('hard-coded decision hash')
          if manifest.get('decision_text_exact')!=exact: errors.append('exact decision text')
          if manifest.get('decision_hash_sha256')!=expected_hash: errors.append('decision hash')
          if manifest.get('decision_code')!='ONCHAIN_THREE_NETWORK_SELECTION': errors.append('decision code')
          if manifest.get('source_channel')!='owner_chat': errors.append('source channel')
          if manifest.get('original_message_timestamp_known') is not False: errors.append('timestamp provenance')

          networks=manifest.get('approved_networks',[])
          if [n.get('network_code') for n in networks]!=['TRON','BSC','SOLANA']:
            errors.append('approved network order')
          if [n.get('token_standard') for n in networks]!=['TRC20','BEP20','SPL']:
            errors.append('network standards')
          for network in networks:
            if network.get('approved_by_owner') is not True: errors.append(f"{network.get('network_code')} approval")
            if network.get('active') is not False: errors.append(f"{network.get('network_code')} activation")

          scope=manifest.get('scope',{})
          if scope.get('network_set_approved') is not True: errors.append('network set approval')
          for key in ('network_activation_authorized','settlement_asset_selected','pricing_selected','receiving_addresses_configured','real_money_testing_authorized','v79_publication_authorized'):
            if scope.get(key) is not False: errors.append(key)

          db=manifest.get('database',{})
          if db.get('migration_version')!='20260805092421': errors.append('migration version')
          if db.get('migration_name')!='record_explicit_owner_three_network_decision': errors.append('migration name')
          if db.get('migration_source')!=str(migration_path): errors.append('migration source')
          if db.get('migration_source_commit')!='46c45e7013eaf48cd386883a2c577d5b2d6e802f': errors.append('migration source commit')
          if db.get('decision_record_immutable') is not True: errors.append('immutable record')
          if db.get('decision_table_rls') is not True: errors.append('decision RLS')
          if db.get('browser_table_grants')!=0: errors.append('browser decision grants')

          runtime=manifest.get('runtime_state',{})
          if runtime.get('provider_desired_mode')!='disabled': errors.append('provider mode')
          if runtime.get('provider_lifecycle_status')!='draft': errors.append('provider lifecycle')
          for key in ('checkout_enabled','webhook_enabled','recurring_enabled','refunds_enabled'):
            if runtime.get(key) is not False: errors.append(key)
          for key in ('active_network_count','selected_asset_count','active_price_count','receiving_address_count','invoice_count','chain_observation_count'):
            if runtime.get(key)!=0: errors.append(key)

          required_markers=[
            'crypto_owner_decision_records',
            'crypto_owner_decision_record_immutable',
            "set_config('app.crypto_owner_decision_authorized','true',true)",
            exact,
            expected_hash,
            "'ONCHAIN_THREE_NETWORK_SELECTION'",
            "approved_by_owner=true",
            "status='inactive'",
            "'network_activation',false",
            "'activation',false",
          ]
          for marker in required_markers:
            if marker not in migration: errors.append(f'missing migration marker {marker}')

          if 'No such network-selection decision existed in the conversation' in repair:
            errors.append('stale false provenance statement')
          if exact not in repair or expected_hash not in repair:
            errors.append('repair document provenance')

          if manifest.get('activation_allowed') is not False: errors.append('activation boundary')
          if manifest.get('publication_allowed') is not False: errors.append('publication boundary')
          if manifest.get('stable_root_v78_sha')!='4a278c891d37b3760ec1ac988690ea9ad587b24e': errors.append('v78 boundary')
          if manifest.get('public_application_commit')!='e1cbe2eb1cb9d97295ecfc9836d0f9bac9cfc191': errors.append('public app boundary')
          if manifest.get('pwa_cache')!='crypto-lab-v79-7930-auth1': errors.append('PWA boundary')

          combined=manifest_path.read_text(encoding='utf-8')+'\n'+migration+'\n'+repair
          forbidden=[
            r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            r'\bsb_secret_[A-Za-z0-9_-]{12,}',
            r'\bsk_live_[A-Za-z0-9_-]+',
            r'\bsk_test_[A-Za-z0-9_-]+',
            r'\bwhsec_[A-Za-z0-9_-]+',
            r'postgres(?:ql)?://[^\s]+:[^\s]+@',
            r'\b(?:seed phrase|mnemonic)\s*:',
          ]
          for pattern in forbidden:
            if re.search(pattern,combined,re.I): errors.append(f'forbidden material {pattern}')

          if errors:
            print('\n'.join('ERROR: '+e for e in errors))
            sys.exit(1)
          print('Owner network decision evidence: OK')
          PY

      - name: Preserve stable v78 and v79 public assets
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
          test "$(git hash-object v79/commercial-extension.js)" = "9d300dd2276e55ffc4ad1b8fcb60766046bba8f6"
          test "$(git hash-object v79/service-worker.js)" = "33bfb7856afa2c49d870fb3607f8bb1279e47f32"
          grep -F 'crypto-lab-v79-7930-auth1' v79/service-worker.js >/dev/null
