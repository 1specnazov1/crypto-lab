name: Clean v79 Release Manifest Legacy Keys Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-clean-release-manifest-legacy-once.yml'

permissions:
  contents: write

concurrency:
  group: v79-clean-release-manifest-legacy-once
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove contradictory legacy keys
        run: |
          set -euo pipefail
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python scripts/v79_clean_release_manifest_legacy_keys.py
          python scripts/v79_validate_onchain_foundation.py
          git add docs/release-manifests/crypto-lab-v79-7930.json
          git commit -m 'Remove contradictory legacy on-chain release keys'
          git push origin HEAD:main
