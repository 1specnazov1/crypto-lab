name: Validate v79 Maintenance Passed Post-Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-maintenance-passed-postsync-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create stable post-sync commit
        run: |
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/v79-maintenance-passed-postsync-once.yml
          git add .github/workflows/v79-maintenance-passed-postsync-once.yml
          git commit -m 'Validate maintenance passed post-sync release'
          git push
      - name: Wait for main ref propagation
        run: sleep 20
      - name: Dispatch all post-sync gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-maintenance-evidence-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
