name: Validate v79 Release Manifest Contract
on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/**'
      - 'supabase/migrations/**'
      - 'scripts/v79_validate_onchain_foundation.py'
      - 'v79/commercial-extension.js'
      - 'v79/pricing-overlay.js'
      - '.github/workflows/v79-release-manifest-contract.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/v79_validate_onchain_foundation.py
      - name: Validate release inventory and immutable boundaries
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          release=json.loads(Path('docs/release-manifests/crypto-lab-v79-7930.json').read_text())
          onchain=json.loads(Path('docs/release-manifests/crypto-lab-v79-onchain-payments.json').read_text())
          owner=json.loads(Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').read_text())
          pricing=json.loads(Path('docs/release-manifests/crypto-lab-v79-owner-pricing-decision.json').read_text())
          assert release['build']=='7930' and release['project_ref']=='txhzxbizjpinowepfjkm'
          assert release['boundaries']['v79_published_over_v78'] is False
          expected='4a278c891d37b3760ec1ac988690ea9ad587b24e'
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()==expected
          assert release['stable_root']['sha']==expected
          seen=set()
          for item in release['migrations']:
            key=(item.get('version'),item.get('name'))
            assert key not in seen
            seen.add(key)
            if item.get('source'):
              assert Path(item['source']).is_file(),item['source']
          assert onchain['schema_version']==14
          assert onchain['authoritative_migration']['version']=='20260805180435'
          assert [x['version'] for x in onchain['preparation_migrations']]==[
            '20260805183433','20260805183530','20260805185155','20260805191917'
          ]
          assert all(Path(x['source']).is_file() for x in onchain['preparation_migrations'])
          assert onchain['approved_networks']==['ETHEREUM','TRON','SOLANA']
          assert onchain['selected_assets']==['USDT','USDC']
          assert onchain['pricing']['currency']=='USD'
          assert onchain['pricing']['basic_amount_minor']==2000
          assert onchain['pricing']['pro_amount_minor']==4900
          assert onchain['pricing']['owner_approved'] is True
          assert onchain['pricing']['active_row_count']==0
          runtime=onchain['runtime_state']
          assert runtime['approved_network_count']==3 and runtime['active_network_count']==0
          assert runtime['selected_asset_count']==2 and runtime['official_supported_pair_count']==5
          assert runtime['approved_price_count']==4 and runtime['active_price_count']==0
          assert runtime['enabled_network_asset_count']==0 and runtime['receiving_address_count']==0
          assert runtime['configuration_ready'] is False and runtime['activation_ready'] is False
          assert onchain['activation_allowed'] is False and onchain['publication_allowed'] is False
          assert owner['decision_hash_sha256']=='df7a3a536fc641c961f0f54187d76f44aecc2b8ccd0edbfdd33623cc32773750'
          assert pricing['decision_hash_sha256']=='94518ffc701c792338d1a259594674d3fad52f4fc071478045e4488b4da8e61c'
          assert [x['amount_minor'] for x in pricing['plans']]==[2000,4900]
          assert all(x['active'] is False for x in pricing['plans'])
          print('Release contract and owner-approved inactive BASIC $20 / PRO $49 pricing: OK')
          PY
