name: Validate v79 Release Manifest Contract
on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/**'
      - 'supabase/migrations/**'
      - 'scripts/v79_validate_onchain_foundation.py'
      - '.github/workflows/v79-release-manifest-contract.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/v79_validate_onchain_foundation.py
      - name: Validate release inventory and immutable boundaries
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          release=json.loads(Path('docs/release-manifests/crypto-lab-v79-7930.json').read_text())
          onchain=json.loads(Path('docs/release-manifests/crypto-lab-v79-onchain-payments.json').read_text())
          owner=json.loads(Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').read_text())
          assert release['build']=='7930' and release['project_ref']=='txhzxbizjpinowepfjkm'
          assert release['boundaries']['v79_published_over_v78'] is False
          expected='4a278c891d37b3760ec1ac988690ea9ad587b24e'
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()==expected
          assert release['stable_root']['sha']==expected
          seen=set()
          for item in release['migrations']:
            key=(item.get('version'),item.get('name'))
            assert key not in seen
            seen.add(key)
            if item.get('source'):
              assert Path(item['source']).is_file(),item['source']
          assert onchain['schema_version']==11
          assert onchain['authoritative_migration']['version']=='20260805180435'
          assert onchain['approved_networks']==['ETHEREUM','TRON','SOLANA']
          assert onchain['selected_assets']==['USDT','USDC']
          assert onchain['runtime_state']['approved_network_count']==3
          assert onchain['runtime_state']['active_network_count']==0
          assert onchain['runtime_state']['selected_asset_count']==2
          assert onchain['runtime_state']['enabled_network_asset_count']==0
          assert onchain['activation_allowed'] is False and onchain['publication_allowed'] is False
          assert owner['decision_hash_sha256']=='df7a3a536fc641c961f0f54187d76f44aecc2b8ccd0edbfdd33623cc32773750'
          print('Release contract and owner payment overlay: OK')
          PY
