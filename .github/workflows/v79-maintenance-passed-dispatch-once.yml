name: Dispatch v79 Maintenance Passed Gates Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-maintenance-passed-dispatch-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove one-shot workflow
        run: |
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/v79-maintenance-passed-dispatch-once.yml
          git add .github/workflows/v79-maintenance-passed-dispatch-once.yml
          git commit -m 'Dispatch maintenance passed candidate gates'
          git push
      - name: Dispatch candidate gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-maintenance-evidence-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
