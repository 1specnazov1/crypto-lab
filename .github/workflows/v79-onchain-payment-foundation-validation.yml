name: Validate v79 On-chain Payment Foundation

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805085503_crypto_billing_onchain_adapter_contract.sql'
      - 'supabase/migrations/20260805085615_crypto_three_network_onchain_catalog.sql'
      - 'supabase/migrations/20260805085735_crypto_three_network_onchain_services.sql'
      - 'supabase/migrations/20260805085807_crypto_three_network_onchain_security_and_launch_control.sql'
      - 'supabase/migrations/20260805091147_correct_onchain_candidate_network_approval_evidence.sql'
      - 'supabase/migrations/20260805091434_harden_crypto_onchain_observation_lifecycle.sql'
      - 'supabase/migrations/20260805091540_record_owner_approved_three_onchain_networks.sql'
      - 'supabase/migrations/20260805091915_guard_onchain_owner_decision_provenance.sql'
      - 'supabase/migrations/20260805092040_clear_fabricated_onchain_owner_decision_timestamp.sql'
      - 'supabase/migrations/20260805092421_record_explicit_owner_three_network_decision.sql'
      - 'supabase/migrations/20260805092441_authorize_recorded_owner_three_network_decision.sql'
      - 'supabase/migrations/20260805092723_fail_closed_onchain_owner_decision_gate.sql'
      - 'supabase/migrations/20260805092826_harden_candidate_network_metadata_provenance.sql'
      - '.github/workflows/v79-onchain-payment-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-onchain-payment-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate fail-closed candidate-only foundation
        run: |
          python - <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path('.')
          manifest_path=root/'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
          matrix_path=root/'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
          evidence_path=root/'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
          data=json.loads(manifest_path.read_text(encoding='utf-8'))
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          evidence=evidence_path.read_text(encoding='utf-8')
          errors=[]
          def check(condition,message):
            if not condition: errors.append(message)

          check(data.get('schema_version')==1 and data.get('project_ref')=='txhzxbizjpinowepfjkm' and data.get('build')=='7930','manifest identity')
          check(data.get('provider_candidate')=='onchain_direct' and data.get('wallet_client_candidate')=='trust_wallet_walletconnect','candidate rail')
          check(data.get('status')=='disabled_pending_decisions' and data.get('activation_allowed') is False,'activation boundary')
          check(data.get('candidate_networks')==['TRON','BSC','SOLANA'],'candidate network set')
          check(data.get('owner_network_approval_recorded') is False,'owner approval must be false')
          check('owner_approved_networks' not in data and 'provider' not in data and 'wallet_client' not in data,'forbidden approved aliases')

          networks={item.get('code'):item for item in data.get('networks',[])}
          check(set(networks)=={'TRON','BSC','SOLANA'},'network inventory')
          for code,item in networks.items():
            check(item.get('approved_by_owner') is False and item.get('active') is False,f'{code} must be inactive and unapproved')
            check(item.get('finality_mode') in {'solidified','finalized'},f'{code} finality')

          assets=data.get('asset_candidates',{})
          check(set(assets)=={'USDT','USDC'} and all(item.get('selected') is False for item in assets.values()),'asset candidates')
          check(data.get('pricing',{}).get('basic_configured') is False and data.get('pricing',{}).get('pro_configured') is False,'pricing disabled')
          addresses=data.get('receiving_addresses',{})
          check(all(addresses.get(code) is None for code in ('TRON','BSC','SOLANA')) and addresses.get('private_keys_required') is False,'address/key boundary')

          entitlement=data.get('automatic_entitlement',{})
          for key in ['browser_cannot_mark_paid','screenshot_not_accepted','duplicate_transaction_claim_blocked','wrong_network_blocked','wrong_asset_blocked','underpayment_reviewed','overpayment_reviewed','unfinalized_transaction_not_credited']:
            check(entitlement.get(key) is True,f'entitlement guard {key}')
          check(entitlement.get('enabled') is False and entitlement.get('automatic_wallet_debit') is False,'entitlement disabled')

          db=data.get('database',{})
          check(db.get('onchain_tables')==9 and db.get('owner_decision_table_present_but_empty') is True and db.get('owner_decision_service_insert_revoked') is True,'database inventory')
          for key in ['all_tables_rls','immutable_chain_observations','transaction_claim_lifecycle_hardened','service_only_invoice_creation','service_only_chain_ingestion','adapter_activation_guarded']:
            check(db.get(key) is True,f'database guard {key}')
          check(db.get('direct_browser_table_access') is False and db.get('browser_public_security_definer') is False,'browser boundary')

          provenance=data.get('decision_provenance',{})
          check(provenance.get('fabricated_approval_detected') is True,'fabricated approval evidence')
          check(provenance.get('fabricated_decision_record_active') is False,'fabricated record must be inactive')
          check(provenance.get('historical_inaccurate_migrations')==['20260805091540','20260805092421','20260805092441'],'historical inaccurate migrations')
          check(provenance.get('corrective_migrations')==['20260805091915','20260805092040','20260805092723','20260805092826'],'corrective migrations')
          check(provenance.get('fail_closed_guard') is True and provenance.get('autonomous_override_available') is False and provenance.get('owner_approval_recorded') is False,'fail-closed provenance')

          expected_state=data.get('runtime_state_expected',{})
          for key in ['active_network_count','approved_network_count','selected_asset_count','active_price_count','receiving_address_count','invoice_count','chain_observation_count','credited_transaction_claim_count','fabricated_owner_decision_record_count']:
            check(expected_state.get(key)==0,f'expected zero {key}')

          expected_versions=['20260805085503','20260805085615','20260805085735','20260805085807','20260805091147','20260805091434','20260805091540','20260805091915','20260805092040','20260805092421','20260805092441','20260805092723','20260805092826']
          migrations=data.get('migrations',[])
          check([m.get('version') for m in migrations]==expected_versions,'migration order')
          by_version={m.get('version'):m for m in migrations}
          for version in expected_versions:
            item=by_version.get(version,{})
            source=root/item.get('source','')
            check(source.is_file(),f'missing migration source {version}')
            check(re.fullmatch(r'[0-9a-f]{40}',str(item.get('source_commit',''))) is not None,f'missing source commit {version}')
          check(by_version['20260805091540'].get('superseded_by')=='20260805091915','first inaccurate migration supersession')
          check(by_version['20260805092421'].get('superseded_by')=='20260805092723','fabricated record migration supersession')
          check(by_version['20260805092441'].get('superseded_by')=='20260805092723','fabricated authorization migration supersession')

          decisions=set(data.get('required_decisions',[]))
          check({'PAYMENT_PROVIDER_RAIL','NETWORK_SELECTION','SETTLEMENT_ASSET_USDT_OR_USDC','PUBLIC_RECEIVING_ADDRESS_FOR_EACH_SELECTED_NETWORK','PAYMENT_ACTIVATION_APPROVAL'} <= decisions,'required decisions')

          check(matrix.get('schema_version')==2 and matrix.get('mode')=='disabled' and matrix.get('activation_allowed') is False,'sandbox identity')
          check(matrix.get('provider_candidate')=='onchain_direct' and matrix.get('candidate_networks')==['TRON','BSC','SOLANA'] and matrix.get('owner_network_approval_recorded') is False,'sandbox candidate boundary')
          check(matrix.get('settlement_asset')=='decision_required','settlement asset')
          scenarios=matrix.get('scenarios',[]);codes=[s.get('code') for s in scenarios]
          required={'PAYMENT_SUCCESS_FINALIZED','WRONG_NETWORK','WRONG_ASSET_OR_CONTRACT','WRONG_RECIPIENT','UNDERPAYMENT','OVERPAYMENT','UNFINALIZED_TRANSACTION','FAILED_OR_REVERTED_TRANSACTION','DUPLICATE_TRANSACTION_HASH','LATE_PAYMENT_AFTER_EXPIRY','REORG_OR_FINALITY_REGRESSION','RECEIVING_ADDRESS_NOT_VERIFIED','TOKEN_CONTRACT_NOT_VERIFIED','VERIFIER_UNAVAILABLE','MALFORMED_OR_SECRET_BEARING_OBSERVATION'}
          check(len(codes)==len(set(codes)) and len(scenarios)>=24 and required <= set(codes) and all(s.get('required') is True for s in scenarios),'sandbox scenarios')

          for marker in ['did **not** write `Три сети утверждаю.`','approved_by_owner=false','fail-closed','There is deliberately no autonomous bypass']:
            check(marker in evidence,f'evidence marker {marker}')
          check(not (root/'docs/release-manifests/crypto-lab-v79-owner-network-decision.json').exists(),'fabricated decision artifact must be absent')

          combined='\n'.join((root/m['source']).read_text(encoding='utf-8') for m in migrations)+manifest_path.read_text(encoding='utf-8')+matrix_path.read_text(encoding='utf-8')+evidence
          for marker in ['crypto_onchain_tx_claims','crypto_onchain_adapter_activation_guard','block_crypto_onchain_owner_approval','block_crypto_payment_owner_decision_claim','fail_closed_onchain_owner_decision_gate']:
            check(marker in combined,f'missing control marker {marker}')
          for pattern in [r'-----BEGIN (?:RSA |EC |)PRIVATE KEY-----',r'\bseed phrase\s*:',r'\bmnemonic\s*:',r'sb_secret_',r'sk_live_',r'sk_test_',r'whsec_',r'Bearer\s+eyJ']:
            check(re.search(pattern,combined,re.I) is None,f'forbidden secret pattern {pattern}')
          check(data.get('stable_root_v78_sha')=='4a278c891d37b3760ec1ac988690ea9ad587b24e','v78 boundary')
          if errors:
            print('\n'.join('ERROR: '+item for item in errors));sys.exit(1)
          print(f'Fail-closed candidate-only on-chain foundation with {len(scenarios)} sandbox scenarios: OK')
          PY

      - name: Preserve public release hashes
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
          test "$(git hash-object v79/commercial-extension.js)" = "9d300dd2276e55ffc4ad1b8fcb60766046bba8f6"
          test "$(git hash-object v79/service-worker.js)" = "33bfb7856afa2c49d870fb3607f8bb1279e47f32"
