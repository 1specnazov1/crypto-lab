name: Validate v79 On-chain Payment Foundation

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'docs/release-manifests/crypto-lab-v79-owner-network-decision.json'
      - 'supabase/migrations/20260805091434_harden_crypto_onchain_observation_lifecycle.sql'
      - 'supabase/migrations/20260805094628_restore_canonical_owner_three_network_authority.sql'
      - '.github/workflows/v79-onchain-payment-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Validate approved networks and disabled activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          onchain=json.loads(Path('docs/release-manifests/crypto-lab-v79-onchain-payments.json').read_text())
          matrix=json.loads(Path('docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json').read_text())
          decision=json.loads(Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').read_text())
          migration=Path('supabase/migrations/20260805094628_restore_canonical_owner_three_network_authority.sql').read_text()
          lifecycle=Path('supabase/migrations/20260805091434_harden_crypto_onchain_observation_lifecycle.sql').read_text()
          networks=['TRON','BSC','SOLANA']
          fingerprint='57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be'

          assert onchain['schema_version']==4
          assert onchain['approved_networks']==networks
          assert onchain['owner_network_approval_recorded'] is True
          assert onchain['activation_allowed'] is False
          assert all(x['approved_by_owner'] is True and x['active'] is False for x in onchain['networks'])
          assert onchain['owner_decision']['decision_text_exact']=='Три сети утверждаю.'
          assert onchain['owner_decision']['decision_hash_sha256']==fingerprint
          assert onchain['runtime_state_expected']['approved_network_count']==3
          assert onchain['runtime_state_expected']['active_network_count']==0
          assert onchain['runtime_state_expected']['provider_desired_mode']=='disabled'
          assert onchain['runtime_state_expected']['checkout_enabled'] is False
          assert onchain['database']['owner_decision_integrity_state']=='healthy'
          assert onchain['database']['onchain_integrity_state']=='healthy'

          assert matrix['schema_version']==5
          assert matrix['approved_networks']==networks
          assert matrix['owner_network_approval_recorded'] is True
          assert matrix['mode']=='disabled'
          assert matrix['activation_allowed'] is False
          assert matrix['scenario_count']==28
          assert len(matrix['scenarios'])==28

          assert decision['decision_text_exact']=='Три сети утверждаю.'
          assert decision['decision_hash_sha256']==fingerprint
          assert decision['activation_allowed'] is False
          assert decision['database']['authoritative_migration_version']=='20260805094628'

          for marker in ['crypto_owner_decision_records','crypto_owner_decision_canonical_three_network_check','crypto_onchain_canonical_three_network_approval_check','crypto_payment_provider_owner_decision_check','crypto_owner_decision_integrity_snapshot']:
            assert marker in migration
          for marker in ['crypto_onchain_tx_claims','finality_regression','conflicting_transaction_observation','transaction_after_invoice_expiry']:
            assert marker in lifecycle

          assert onchain['stable_root_v78_sha']=='4a278c891d37b3760ec1ac988690ea9ad587b24e'
          print('Canonical owner-approved three-network foundation remains disabled and guarded: OK')
          PY
      - name: Preserve public release hashes
        run: |
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
