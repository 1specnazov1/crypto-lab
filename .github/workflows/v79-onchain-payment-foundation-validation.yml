name: Validate v79 On-chain Payment Foundation

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md'
      - 'supabase/migrations/20260805091434_harden_crypto_onchain_observation_lifecycle.sql'
      - 'supabase/migrations/20260805100027_authoritative_candidate_only_payment_recovery.sql'
      - '.github/workflows/v79-onchain-payment-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-onchain-payment-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6

      - name: Validate authoritative candidate-only foundation
        run: |
          python - <<'PY'
          import json,re,sys
          from pathlib import Path

          errors=[]
          def check(value,message):
              if not value: errors.append(message)

          onchain=json.loads(Path('docs/release-manifests/crypto-lab-v79-onchain-payments.json').read_text())
          matrix=json.loads(Path('docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json').read_text())
          migration=Path('supabase/migrations/20260805100027_authoritative_candidate_only_payment_recovery.sql').read_text()
          lifecycle=Path('supabase/migrations/20260805091434_harden_crypto_onchain_observation_lifecycle.sql').read_text()
          evidence=Path('docs/ONCHAIN_OWNER_DECISION_PROVENANCE_REPAIR_7930.md').read_text()

          check(onchain['schema_version']==8,'onchain schema version')
          check(onchain['provider']=='unselected','provider must be unselected')
          check(onchain['provider_candidate']=='onchain_direct','provider candidate')
          check(onchain['status']=='disabled_candidate_only','candidate-only status')
          check(onchain['approved_networks']==[],'approved networks must be empty')
          check(onchain['candidate_networks']==['TRON','BSC','SOLANA'],'candidate network set')
          check(onchain['owner_network_approval_recorded'] is False,'network approval false')
          check(onchain['owner_provider_approval_recorded'] is False,'provider approval false')
          check(onchain['activation_allowed'] is False,'activation false')
          check(all(x['approved_by_owner'] is False and x['active'] is False for x in onchain['networks']),'network runtime boundary')
          check(all(x['selected'] is False for x in onchain['asset_candidates'].values()),'assets unselected')
          check(onchain['pricing']['basic_configured'] is False and onchain['pricing']['pro_configured'] is False,'prices inactive')
          check(all(onchain['receiving_addresses'][x] is None for x in ['TRON','BSC','SOLANA']),'addresses absent')
          check(onchain['automatic_entitlement']['enabled'] is False,'entitlement disabled')
          check(onchain['automatic_entitlement']['automatic_wallet_debit'] is False,'wallet debit disabled')
          check(onchain['database']['active_valid_owner_decision_records']==0,'active owner records zero')
          check(onchain['database']['superseded_invalid_owner_decision_records']==1,'superseded audit retained')
          check(onchain['provenance_incident']['user_never_wrote_fabricated_text'] is True,'conversation fact')
          check(onchain['provenance_incident']['recurring_automation_disabled'] is True,'overlap disabled')
          check(onchain['authoritative_migration']['version']=='20260805100027','authoritative migration')
          check(onchain['runtime_state_expected']['approved_network_count']==0,'approved runtime count')
          check(onchain['runtime_state_expected']['active_network_count']==0,'active runtime count')
          check(onchain['runtime_state_expected']['provider_status']=='decision_required','provider runtime status')
          check(onchain['publication_allowed'] is False,'publication disabled')

          check(matrix['schema_version']==8,'matrix schema version')
          check(matrix['provider']=='unselected','matrix provider unselected')
          check(matrix['mode']=='disabled' and matrix['activation_allowed'] is False,'matrix disabled')
          check(matrix['approved_networks']==[],'matrix approved networks empty')
          check(matrix['candidate_networks']==['TRON','BSC','SOLANA'],'matrix candidates')
          check(matrix['owner_network_approval_recorded'] is False,'matrix owner approval false')
          check(matrix['settlement_asset']=='decision_required','asset decision required')
          check(matrix['scenario_count']==29 and len(matrix['scenarios'])==29,'scenario count')
          check(len({x['code'] for x in matrix['scenarios']})==29,'scenario uniqueness')
          for required in ['UNAUTHORIZED_NETWORK_APPROVAL_ATTEMPT','UNAUTHORIZED_APPROVAL_METADATA_ATTEMPT','UNAUTHORIZED_PROVIDER_DECISION_ATTEMPT','UNAUTHORIZED_OWNER_RECORD_INSERT_ATTEMPT','PREMATURE_NETWORK_ACTIVATION_ATTEMPT']:
              check(required in {x['code'] for x in matrix['scenarios']},f'missing {required}')

          for marker in [
              'crypto_onchain_networks_owner_decision_fail_closed',
              'crypto_payment_provider_owner_decision_fail_closed',
              'crypto_payment_sandbox_owner_claim_fail_closed',
              'crypto_owner_decision_payment_record_fail_closed',
              'block_crypto_onchain_owner_approval',
              'block_crypto_payment_owner_decision_claim',
              'block_crypto_payment_owner_decision_record'
          ]:
              check(marker in migration,f'missing migration marker {marker}')
          for marker in ['crypto_onchain_tx_claims','finality_regression','conflicting_transaction_observation','transaction_after_invoice_expiry']:
              check(marker in lifecycle,f'missing lifecycle marker {marker}')
          for marker in ['did **not** write `Три сети утверждаю.`','two self-rewriting workflows','There is deliberately no autonomous bypass']:
              check(marker in evidence,f'missing evidence marker {marker}')

          check(not Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').exists(),'fabricated decision artifact exists')
          check(not Path('.github/workflows/v79-owner-network-decision-sync-once.yml').exists(),'fabricated sync workflow exists')
          check(not Path('.github/workflows/v79-owner-network-decision-validation.yml').exists(),'fabricated validation workflow exists')

          combined=json.dumps(onchain)+json.dumps(matrix)+migration+evidence
          for pattern in [r'sb_secret_',r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',r'Bearer\s+eyJ']:
              check(re.search(pattern,combined,re.I) is None,f'possible secret {pattern}')
          check(onchain['stable_root_v78_sha']=='4a278c891d37b3760ec1ac988690ea9ad587b24e','v78 boundary')

          if errors:
              print('\n'.join('ERROR: '+x for x in errors));sys.exit(1)
          print('Authoritative candidate-only on-chain foundation and 29-scenario matrix: OK')
          PY

      - name: Preserve public release hashes
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
          test "$(git hash-object v79/commercial-extension.js)" = "9d300dd2276e55ffc4ad1b8fcb60766046bba8f6"
          test "$(git hash-object v79/service-worker.js)" = "33bfb7856afa2c49d870fb3607f8bb1279e47f32"
