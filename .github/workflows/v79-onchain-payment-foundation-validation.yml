name: Validate v79 On-chain Payment Foundation

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
      - 'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
      - 'supabase/migrations/20260805093023_enforce_explicit_owner_three_network_decision_record.sql'
      - '.github/workflows/v79-onchain-payment-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-onchain-payment-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - name: Validate owner-approved disabled foundation
        run: |
          python - <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path('.')
          manifest_path=root/'docs/release-manifests/crypto-lab-v79-onchain-payments.json'
          matrix_path=root/'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
          migration_path=root/'supabase/migrations/20260805093023_enforce_explicit_owner_three_network_decision_record.sql'
          data=json.loads(manifest_path.read_text(encoding='utf-8'))
          matrix=json.loads(matrix_path.read_text(encoding='utf-8'))
          migration=migration_path.read_text(encoding='utf-8')
          errors=[]
          def check(value,message):
            if not value: errors.append(message)
          check(data.get('schema_version')==2 and data.get('project_ref')=='txhzxbizjpinowepfjkm' and data.get('build')=='7930','manifest identity')
          check(data.get('provider')=='onchain_direct' and data.get('wallet_client')=='trust_wallet_walletconnect','payment rail')
          check(data.get('status')=='disabled_pending_remaining_decisions' and data.get('activation_allowed') is False,'activation boundary')
          check(data.get('approved_networks')==['TRON','BSC','SOLANA'] and data.get('owner_network_approval_recorded') is True,'approved network set')
          decision=data.get('owner_decision',{})
          check(decision.get('decision_code')=='ONCHAIN_THREE_NETWORK_SELECTION','decision code')
          check(decision.get('decision_text_exact')=='Три сети утверждаю.','decision text')
          check(decision.get('decision_hash_sha256')=='57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be','decision hash')
          check(decision.get('immutable_record') is True and decision.get('network_activation_authorized') is False,'decision scope')
          networks={x.get('code'):x for x in data.get('networks',[])}
          check(set(networks)=={'TRON','BSC','SOLANA'},'network inventory')
          for code,item in networks.items():
            check(item.get('approved_by_owner') is True and item.get('active') is False,f'{code} approved but inactive')
          assets=data.get('asset_candidates',{})
          check(set(assets)=={'USDT','USDC'} and all(x.get('selected') is False for x in assets.values()),'asset remains undecided')
          check(assets['USDT']['network_status']['BSC']=='pegged_token_contract_and_separate_owner_acceptance_required','BSC USDT boundary')
          check(assets['USDC']['network_status']['TRON']=='not_listed_by_circle' and assets['USDC']['network_status']['BSC']=='not_listed_by_circle','USDC three-network constraint')
          check(data.get('pricing',{}).get('basic_configured') is False and data.get('pricing',{}).get('pro_configured') is False,'prices disabled')
          addresses=data.get('receiving_addresses',{})
          check(all(addresses.get(code) is None for code in ('TRON','BSC','SOLANA')) and addresses.get('private_keys_required') is False,'address/key boundary')
          db=data.get('database',{})
          for key in ['owner_decision_record_immutable','all_tables_rls','immutable_chain_observations','transaction_claim_lifecycle_hardened','service_only_invoice_creation','service_only_chain_ingestion','adapter_activation_guarded','approved_network_set_guarded']:
            check(db.get(key) is True,f'database guard {key}')
          check(db.get('owner_decision_record_count')==1 and db.get('direct_browser_table_access') is False and db.get('browser_public_security_definer') is False,'database state')
          state=data.get('runtime_state_expected',{})
          check(state.get('approved_network_count')==3 and state.get('active_network_count')==0,'runtime network state')
          for key in ['selected_asset_count','active_price_count','receiving_address_count','invoice_count','chain_observation_count','credited_transaction_claim_count']:
            check(state.get(key)==0,f'expected zero {key}')
          check(matrix.get('schema_version')==2 and matrix.get('provider')=='onchain_direct' and matrix.get('mode')=='disabled','matrix identity')
          check(matrix.get('approved_networks')==['TRON','BSC','SOLANA'] and matrix.get('owner_network_approval_recorded') is True,'matrix network decision')
          check(matrix.get('settlement_asset')=='decision_required' and matrix.get('activation_allowed') is False,'matrix activation')
          scenarios=matrix.get('scenarios',[]);codes=[x.get('code') for x in scenarios]
          required={'PAYMENT_SUCCESS_FINALIZED','WRONG_NETWORK','WRONG_ASSET_OR_CONTRACT','UNDERPAYMENT','OVERPAYMENT','UNFINALIZED_TRANSACTION','DUPLICATE_TRANSACTION_HASH','LATE_PAYMENT_AFTER_EXPIRY','REORG_OR_FINALITY_REGRESSION','TOKEN_CONTRACT_NOT_VERIFIED','VERIFIER_UNAVAILABLE'}
          check(len(scenarios)==24 and len(codes)==len(set(codes)) and required<=set(codes) and all(x.get('required') is True for x in scenarios),'sandbox matrix')
          for marker in ['crypto_owner_decision_records','Три сети утверждаю.','Approved network selection cannot be removed','Network selection does not authorize live activation','Approved payment networks cannot be removed or expanded']:
            check(marker in migration,f'migration marker {marker}')
          combined=manifest_path.read_text(encoding='utf-8')+matrix_path.read_text(encoding='utf-8')+migration
          for pattern in [r'-----BEGIN (?:RSA |EC |)PRIVATE KEY-----',r'\bseed phrase\s*:',r'\bmnemonic\s*:',r'sb_secret_',r'sk_live_',r'sk_test_',r'whsec_',r'Bearer\s+eyJ']:
            check(re.search(pattern,combined,re.I) is None,f'forbidden secret pattern {pattern}')
          check(data.get('stable_root_v78_sha')=='4a278c891d37b3760ec1ac988690ea9ad587b24e','v78 boundary')
          if errors:
            print('\n'.join('ERROR: '+x for x in errors));sys.exit(1)
          print('Owner-approved three-network on-chain foundation remains safely disabled: OK')
          PY
      - name: Preserve public release hashes
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4a278c891d37b3760ec1ac988690ea9ad587b24e"
          test "$(git hash-object v79/index.html)" = "b92335b3a3d76e349f1845fd653e1c1021d6d7f6"
          test "$(git hash-object v79/app.html)" = "432fe33542bf58b41bab590caf0fcf5d635f8da4"
          test "$(git hash-object v79/auth-gateway.js)" = "d87c76418461a133c97464452eea020b66e4f30f"
