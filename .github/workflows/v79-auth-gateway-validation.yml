name: Validate v79 Protected Auth Gateway

on:
  push:
    branches: [main]
    paths:
      - 'v79/auth-gateway.js'
      - 'v79/access-gate.js'
      - 'v79/access-verify.html'
      - 'v79/access-verify.js'
      - 'v79/follower-access-guard.js'
      - 'v79/registration-consent.js'
      - 'v79/free-access-ui.js'
      - 'v79/recovery.html'
      - 'v79/commercial-extension.js'
      - 'v79/service-worker.js'
      - 'supabase/functions/crypto-lab-v79-register/**'
      - 'supabase/functions/crypto-x-auth-check/**'
      - 'supabase/functions/crypto-x-oauth-callback/**'
      - 'supabase/functions/crypto-lab-v79-access/**'
      - 'supabase/migrations/*email_bound_access*'
      - 'supabase/migrations/*x_follower*'
      - '.github/workflows/v79-auth-gateway-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate static auth gateway
        run: |
          node --check v79/auth-gateway.js
          node --check v79/access-gate.js
          node --check v79/access-verify.js
          node --check v79/follower-access-guard.js
          node --check v79/registration-consent.js
          node --check v79/free-access-ui.js
          node --check v79/commercial-extension.js
          node --check v79/service-worker.js
          grep -F "protectedAuthGatewayScript" v79/commercial-extension.js
          grep -F "publicFreeAccessScript" v79/commercial-extension.js
          grep -F "./auth-gateway.js" v79/service-worker.js
          grep -F "./follower-access-guard.js" v79/service-worker.js
          grep -F "./access-verify.html" v79/service-worker.js
          grep -F "./access-verify.js" v79/service-worker.js
          grep -F "crypto-lab-v79-7930-free31" v79/service-worker.js
          grep -F "direct_supabase_signup_bypassed:true" v79/auth-gateway.js
          grep -F "x_follower_free" v79/auth-gateway.js
          grep -F "follower_verification_required" v79/auth-gateway.js
          grep -F "Create FREE account" v79/auth-gateway.js
          grep -F "crypto_register" v79/auth-gateway.js
          grep -F "crypto_recover" v79/auth-gateway.js
          grep -F "const TARGET='@CryptoLabPulse'" v79/follower-access-guard.js
          grep -F "X_NOT_CONNECTED" v79/follower-access-guard.js
          grep -F "FOLLOW_REQUIRED" v79/follower-access-guard.js
          grep -F "const DEVICE_KEY='cryptoLabEmailAccessDeviceV1'" v79/access-gate.js
          grep -F "device_hash:deviceHash" v79/access-gate.js
          grep -F "device_secret:device" v79/access-verify.js
          grep -F "verifyOtp({token_hash:b.token_hash,type:'email'})" v79/access-verify.js
          grep -F '<script src="./access-verify.js"></script>' v79/access-verify.html
          grep -F "free-access-ui.js" v79/registration-consent.js
          ! grep -F "new MutationObserver(render)" v79/registration-consent.js
          ! grep -F "friendsFamilyAccountScript" v79/commercial-extension.js
          ! grep -F "adminBillingEventsScript" v79/commercial-extension.js

      - name: Validate server-side follower auth source
        run: |
          set -euo pipefail
          REG='supabase/functions/crypto-lab-v79-register/index.ts'
          XA='supabase/functions/crypto-x-auth-check/index.ts'
          XC='supabase/functions/crypto-x-oauth-callback/index.ts'
          ACCESS='supabase/functions/crypto-lab-v79-access/index.ts'
          test -f "$REG"; test -f "$XA"; test -f "$XC"; test -f "$ACCESS"
          grep -F 'registration_mode:"x_follower_free"' "$REG"
          grep -F 'reserve_crypto_registration_attempt' "$REG"
          grep -F 'follower_verification_required:true' "$REG"
          grep -F 'x_auth_access_type=read' "$XA"
          grep -F 'connection_status,username' "$XA"
          grep -F 'crypto_x_follower_access' "$XA"
          grep -F 'connection_status,username' "$XC"
          grep -F 'x_account_already_linked' "$XC"
          grep -F 'crypto_x_follower_access' "$XC"
          grep -F 'const TTL_MINUTES=30' "$ACCESS"
          grep -F 'deviceHash!==grant.device_hash' "$ACCESS"
          grep -F '.is("redeem_started_at",null)' "$ACCESS"
          grep -F 'admin.auth.admin.generateLink({type:"magiclink"' "$ACCESS"
          python - <<'PY'
          import pathlib,re
          files=[
            pathlib.Path('v79/auth-gateway.js'),
            pathlib.Path('v79/follower-access-guard.js'),
            pathlib.Path('supabase/functions/crypto-lab-v79-register/index.ts'),
            pathlib.Path('supabase/functions/crypto-x-auth-check/index.ts'),
            pathlib.Path('supabase/functions/crypto-x-oauth-callback/index.ts')
          ]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          for pattern in [r'sb_secret_',r'sk_live_',r'sk_test_',r'whsec_',r'-----BEGIN (?:RSA |EC |)PRIVATE KEY-----']:
              assert not re.search(pattern,text,re.I),pattern
          assert 'X_API_SECRET' not in pathlib.Path('v79/follower-access-guard.js').read_text(encoding='utf-8')
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in pathlib.Path('v79/follower-access-guard.js').read_text(encoding='utf-8')
          print('Follower auth source contract: OK')
          PY

      - name: Verify live protected auth lifecycle
        run: |
          curl --fail --silent --show-error \
            -H 'Origin: https://1specnazov1.github.io' \
            'https://txhzxbizjpinowepfjkm.supabase.co/functions/v1/crypto-lab-v79-access' \
            -o /tmp/access.json
          curl --fail --silent --show-error \
            -H 'Origin: https://1specnazov1.github.io' \
            'https://txhzxbizjpinowepfjkm.supabase.co/functions/v1/crypto-lab-v79-register' \
            -o /tmp/register.json
          curl --fail --silent --show-error \
            -H 'Origin: https://1specnazov1.github.io' \
            'https://txhzxbizjpinowepfjkm.supabase.co/functions/v1/crypto-lab-v79-recover' \
            -o /tmp/recover.json
          python - <<'PY'
          import json
          access=json.load(open('/tmp/access.json'))
          register=json.load(open('/tmp/register.json'))
          recover=json.load(open('/tmp/recover.json'))
          assert access.get('ok') is True
          assert access.get('mode')=='email_bound'
          assert access.get('request_enabled') is True
          assert access.get('device_bound') is True
          assert access.get('captcha_action')=='crypto_access_request'
          assert int(access.get('expires_minutes',0))==30
          assert register.get('ok') is True
          assert register.get('enabled') is True
          assert register.get('registration_mode')=='x_follower_free'
          assert register.get('follower_verification_required') is True
          assert register.get('target_handle')=='@CryptoLabPulse'
          assert register.get('captcha_provider')=='turnstile'
          assert register.get('captcha_action')=='crypto_register'
          assert int(register.get('password_min_length',0))>=10
          assert {'terms','privacy','risk'}.issubset(set(register.get('required_legal_keys') or []))
          readiness=register.get('readiness') or {}
          assert readiness.get('public_registration') is True
          assert readiness.get('turnstile') is True
          assert readiness.get('mail_provider') is True
          assert readiness.get('legal_documents') is True
          assert recover.get('ok') is True
          assert isinstance(recover.get('enabled'),bool)
          assert recover.get('captcha_provider')=='turnstile'
          assert recover.get('captcha_action')=='crypto_recover'
          assert recover.get('email_enumeration_safe') is True
          print('Live self-service registration + recovery boundaries: OK')
          PY

      - name: Verify free auth and payment boundaries
        run: |
          test "$(git hash-object index.html)" = '4a278c891d37b3760ec1ac988690ea9ad587b24e'
          python - <<'PY'
          import pathlib,re
          gateway=pathlib.Path('v79/auth-gateway.js').read_text(encoding='utf-8')
          follower=pathlib.Path('v79/follower-access-guard.js').read_text(encoding='utf-8')
          access=pathlib.Path('v79/access-gate.js').read_text(encoding='utf-8')
          verify_page=pathlib.Path('v79/access-verify.html').read_text(encoding='utf-8')
          verify_runtime=pathlib.Path('v79/access-verify.js').read_text(encoding='utf-8')
          consent=pathlib.Path('v79/registration-consent.js').read_text(encoding='utf-8')
          extension=pathlib.Path('v79/commercial-extension.js').read_text(encoding='utf-8')
          sw=pathlib.Path('v79/service-worker.js').read_text(encoding='utf-8')
          recovery=pathlib.Path('v79/recovery.html').read_text(encoding='utf-8')
          text='\n'.join([gateway,follower,access,verify_page,verify_runtime,consent,extension,sw,recovery])
          for pattern in [r'sb_secret_',r'sk_live_',r'sk_test_',r'whsec_',r'-----BEGIN (?:RSA |EC |)PRIVATE KEY-----',r'Bearer\s+eyJ']:
              assert not re.search(pattern,text,re.I),pattern
          assert 'CRYPTO_TURNSTILE_SECRET_KEY' not in gateway
          assert 'CRYPTO_TURNSTILE_SECRET_KEY' not in access
          assert "new Set(['terms','privacy','risk'])" in consent
          assert 'friendsFamilyAccountScript' not in extension
          assert 'adminBillingEventsScript' not in extension
          assert 'publicFreeAccessScript' in extension
          assert 'x_follower_free' in gateway
          assert '@CryptoLabPulse' in follower
          assert 'crypto-lab-v79-7930-free31' in sw
          assert 'referrer' in recovery.lower() and 'no-referrer' in recovery.lower()
          assert 'referrer' in verify_page.lower() and 'no-referrer' in verify_page.lower()
          assert '<script src="./access-verify.js"></script>' in verify_page
          inline=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',verify_page,re.S|re.I)
          assert not any(script.strip() for script in inline)
          print('Follower-only FREE auth/payment boundaries: OK')
          PY