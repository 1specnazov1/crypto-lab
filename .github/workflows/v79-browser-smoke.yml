name: V79 Browser Smoke

on:
  push:
    paths:
      - 'v79/**'
      - 'tests/v79-mobile-smoke.spec.js'
      - 'tests/v79-intelligence-home-smoke.spec.js'
      - 'tests/v79-news-shell-smoke.spec.js'
      - 'tests/v79-news-filter-cycle-smoke.spec.js'
      - 'tests/v79-admin-recovery-smoke.spec.js'
      - 'tests/v79-owner-launch-smoke.spec.js'
      - 'tests/v79-owner-mobile-navigation.spec.js'
      - 'tests/v79-public-launch-audit.spec.js'
      - 'playwright.config.mjs'
      - 'playwright.owner-launch.config.mjs'
      - 'playwright.owner-mobile.config.mjs'
      - 'playwright.full-audit.config.mjs'
      - 'package.json'
      - '.github/workflows/v79-browser-smoke.yml'
  pull_request:
    paths:
      - 'v79/**'
      - 'tests/v79-mobile-smoke.spec.js'
      - 'tests/v79-intelligence-home-smoke.spec.js'
      - 'tests/v79-news-shell-smoke.spec.js'
      - 'tests/v79-news-filter-cycle-smoke.spec.js'
      - 'tests/v79-admin-recovery-smoke.spec.js'
      - 'tests/v79-owner-launch-smoke.spec.js'
      - 'tests/v79-owner-mobile-navigation.spec.js'
      - 'tests/v79-public-launch-audit.spec.js'
      - 'playwright.config.mjs'
      - 'playwright.owner-launch.config.mjs'
      - 'playwright.owner-mobile.config.mjs'
      - 'playwright.full-audit.config.mjs'
      - 'package.json'
      - '.github/workflows/v79-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v79-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Playwright test runner
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        run: npx playwright install chromium --with-deps

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/crypto-lab-http.log 2>&1 &
          echo $! > /tmp/crypto-lab-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/v79/app.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crypto-lab-http.log
          exit 1

      - name: Validate D W M analysis timeframes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const chart = fs.readFileSync('v79/chart.html', 'utf8');
          const ai = fs.readFileSync('v79/ai.html', 'utf8');
          const required = [
            ['Chart 1D', chart, 'value="1d">1D'],
            ['Chart 1W', chart, 'value="1w">1W'],
            ['Chart 1M', chart, 'value="1M">1M'],
            ['AI 1D', ai, '<option>1d</option>'],
            ['AI 1W', ai, '<option>1w</option>'],
            ['AI 1M', ai, '<option>1M</option>']
          ];
          for (const [label, source, marker] of required) {
            if (!source.includes(marker)) throw new Error(`${label} missing`);
          }
          console.log('D/W/M analytical timeframe contract OK');
          NODE

      - name: Run stable v79 browser regression
        run: npm run test:v79:browser -- --grep-invert "BTC home terminal renders candles, fallback data and persistent touch timeframe controls|language selection survives reload|v79 owner launch path and mobile navigation remain usable|account logout and repeated login UI lifecycle remains responsive"
        env:
          CI: 'true'

      - name: Validate protected admin recovery
        run: npx playwright test tests/v79-admin-recovery-smoke.spec.js --config=playwright.config.mjs
        env:
          CI: 'true'

      - name: Validate intelligence-first homepage
        run: npx playwright test tests/v79-intelligence-home-smoke.spec.js --config=playwright.config.mjs
        env:
          CI: 'true'

      - name: Validate ticker language and module shell position
        run: npx playwright test tests/v79-news-shell-smoke.spec.js --config=playwright.config.mjs
        env:
          CI: 'true'

      - name: Validate news summary filters and three-pass ticker
        run: npx playwright test tests/v79-news-filter-cycle-smoke.spec.js --config=playwright.config.mjs
        env:
          CI: 'true'

      - name: Run owner desktop launch path
        run: npx playwright test --config=playwright.owner-launch.config.mjs
        env:
          CI: 'true'

      - name: Run owner mobile navigation
        run: npx playwright test --config=playwright.owner-mobile.config.mjs
        env:
          CI: 'true'

      - name: Run full public launch audit
        run: npx playwright test --config=playwright.full-audit.config.mjs
        env:
          CI: 'true'

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: v79-browser-smoke-report
          path: |
            playwright-report/
            playwright-report-full-audit/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
