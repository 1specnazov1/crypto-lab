name: Synchronize v79 Owner Authority 105743 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-sync-105743-once.yml'

permissions:
  contents: write

concurrency:
  group: v79-sync-owner-authority-105743-once
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Commit exact owner-approved inactive state and diagnostic
        run: |
          set -euo pipefail
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          log=docs/release-manifests/v79-owner-authority-105743-sync.txt
          : > "$log"

          set +e
          python scripts/v79_sync_105743.py >> "$log" 2>&1
          sync_status=$?
          python scripts/v79_validate_onchain_foundation.py >> "$log" 2>&1
          validation_status=$?
          set -e

          printf 'sync_status=%s\nvalidation_status=%s\n' "$sync_status" "$validation_status" >> "$log"
          cat "$log"

          git add -A
          git commit -m 'Synchronize final owner-approved inactive payment state'
          git push origin HEAD:main
