name: Finalize Protected Auth Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-auth-release-finalize-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Finalize release evidence
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']='2026-08-05T07:15:00Z'
          manifest['application']['evidence_commit']='9133e3e9b7e1a5ca5ce71ded6e1629c5ece2fb8c'
          evidence=manifest['release_evidence']
          evidence['release_gate_run_id']='30983671681'
          evidence['browser_smoke_run_id']='30983673407'
          evidence['pages_run_id']='30982987926'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v79-auth-release-finalize-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-auth-release-finalize-once.yml
          git commit -m 'Finalize protected auth gateway release evidence'
          git push

      - name: Dispatch final manifest gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-auth-gateway-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
