name: Synchronize v79 Authoritative Payment State Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-authoritative-payment-state-sync-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: v79-authoritative-payment-state-sync-once
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize exact owner-approved inactive state
        run: |
          set -euo pipefail
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/v79_sync_authoritative_payment.py
            python - <<'PY'
          import json,subprocess
          from pathlib import Path
          on=json.loads(Path('docs/release-manifests/crypto-lab-v79-onchain-payments.json').read_text(encoding='utf-8'))
          authority=dict(on['authoritative_migration'])
          authority['source_commit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          owner={
            'schema_version':6,
            'project_ref':'txhzxbizjpinowepfjkm',
            'build':'7930',
            'decision_code':'ONCHAIN_THREE_NETWORK_SELECTION',
            'decision_text_exact':'Три сети утверждаю.',
            'decision_hash_sha256':'57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be',
            'decision_scope':'network_selection_only',
            'active':True,
            'immutable':True,
            'approved_networks':[
              {'network_code':'TRON','standard':'TRC20','approved_by_owner':True,'active':False},
              {'network_code':'BSC','standard':'BEP20','approved_by_owner':True,'active':False},
              {'network_code':'SOLANA','standard':'SPL','approved_by_owner':True,'active':False}
            ],
            'settlement_asset':'pending',
            'activation_allowed':False,
            'publication_allowed':False,
            'checkout_enabled':False,
            'webhook_enabled':False,
            'recurring_enabled':False,
            'refunds_enabled':False,
            'authoritative_migration':authority,
            'stable_root_v78_sha':'4a278c891d37b3760ec1ac988690ea9ad587b24e'
          }
          Path('docs/release-manifests/crypto-lab-v79-owner-network-decision.json').write_text(json.dumps(owner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for path in [
            'docs/release-manifests/crypto-lab-v79-onchain-payments.json',
            'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json',
            'docs/release-manifests/crypto-lab-v79-owner-network-decision.json',
            'docs/release-manifests/crypto-lab-v79-7930.json'
          ]:
            json.loads(Path(path).read_text(encoding='utf-8'))
          assert json.loads(Path('docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json').read_text(encoding='utf-8'))['scenario_count']==29
          print('Local manifest preflight: OK')
          PY
            git rm --ignore-unmatch \
              .github/workflows/v79-103527-authoritative-sync-once.yml \
              scripts/sync_authoritative_103527.py \
              .github/workflows/v79-release-evidence-finalize-once.yml \
              .github/workflows/v79-final-authority-manifest-sync.yml \
              .github/workflows/v79-final-authoritative-manifest-sync-once.yml \
              .github/workflows/v79-authoritative-payment-state-sync-once.yml \
              scripts/v79_sync_authoritative_payment.py
            git add \
              docs/release-manifests/crypto-lab-v79-onchain-payments.json \
              docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json \
              docs/release-manifests/crypto-lab-v79-owner-network-decision.json \
              docs/release-manifests/crypto-lab-v79-7930.json
            python scripts/v79_validate_onchain_foundation.py
            git commit -m 'Synchronize exact owner-approved inactive on-chain state'
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt ${attempt} conflicted; retrying from latest main"
            sleep 2
          done
          test "$pushed" = true
      - name: Dispatch authoritative gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 8
          gh workflow run v79-onchain-payment-foundation-validation.yml --ref main
          gh workflow run v79-onchain-lifecycle-hardening-validation.yml --ref main
          gh workflow run v79-owner-network-decision-validation.yml --ref main
          gh workflow run v79-owner-decision-failclosed-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-browser-smoke.yml --ref main
