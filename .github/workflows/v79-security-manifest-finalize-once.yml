name: Finalize v79 Security Manifest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-security-manifest-finalize-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind applied migrations and security evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['updated_at']='2026-08-05T09:01:00Z'
          manifest['application']['evidence_commit']='29d94da6e83061990b04da64ca64de5eda27b508'

          migrations=manifest.setdefault('migrations',[])
          existing={(str(item.get('version')),str(item.get('name'))) for item in migrations}
          additions=[
            {
              'version':'20260805085106',
              'name':'secure_and_schedule_crypto_x_pipeline_v2'
            },
            {
              'version':'20260805085155',
              'name':'route_crypto_x_cron_through_dispatcher'
            },
            {
              'version':'20260805085208',
              'name':'harden_crypto_x_claim_publish_job_execution',
              'source':'supabase/migrations/20260805085208_harden_crypto_x_claim_publish_job_execution.sql',
              'source_commit':'794af91d96bbb65dac191d7af19d882de037d65f'
            }
          ]
          for item in additions:
            key=(item['version'],item['name'])
            if key not in existing:
              migrations.append(item)
              existing.add(key)

          hardening=manifest.setdefault('operational_hardening',{})
          hardening.update({
            'security_hardening_gate_run_id':'30991272596',
            'browser_public_definers_zero':True,
            'crypto_x_claim_service_role_only':True,
            'crypto_x_claim_search_path_hardened':True,
            'crypto_x_automation_enabled':False,
            'crypto_x_live_publish_enabled':False,
            'crypto_x_dry_run':True,
            'crypto_x_generation_enabled':False,
            'crypto_x_queues_empty_at_verification':True,
            'security_acl_repair_document':'docs/SECURITY_ACL_REPAIR_7930.md'
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm .github/workflows/v79-security-manifest-finalize-once.yml
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/release-manifests/crypto-lab-v79-7930.json .github/workflows/v79-security-manifest-finalize-once.yml
          git commit -m 'Bind security hardening and applied migrations'
          git push

      - name: Dispatch post-bind gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20
          gh workflow run v79-preview-validation.yml --ref main
          gh workflow run v79-release-manifest-contract.yml --ref main
          gh workflow run v79-identity-payment-preparation.yml --ref main
          gh workflow run v79-security-hardening-validation.yml --ref main
