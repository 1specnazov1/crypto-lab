name: Sync Final v79 Authority Manifest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-final-authority-manifest-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch release manifest and remove this workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/release-manifests/crypto-lab-v79-7930.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          final={
            'version':'20260805095547',
            'name':'finalize_explicit_owner_three_network_selection_after_race',
            'source':'supabase/migrations/20260805095547_finalize_explicit_owner_three_network_selection_after_race.sql',
            'source_commit':'2cc1e4eaee419c69533139eb6e615865aa9ea2d1',
            'authoritative':True
          }
          migrations=data.setdefault('migrations',[])
          keyed={(m.get('version'),m.get('name')):m for m in migrations}
          key=(final['version'],final['name'])
          if key in keyed:
            keyed[key].update(final)
          else:
            migrations.append(final)

          data['updated_at']='2026-08-05T10:00:00Z'
          operational=data.setdefault('operational_hardening',{})
          operational.update({
            'onchain_payment_provider':'onchain_direct',
            'onchain_wallet_client':'trust_wallet_walletconnect',
            'onchain_owner_decision_code':'ONCHAIN_THREE_NETWORK_SELECTION',
            'onchain_owner_decision_text_exact':'Три сети утверждаю.',
            'onchain_owner_decision_hash':'57458fbfe9da805c8dc8bec7ad2d8500516ca4568c35903565402aed62d848be',
            'onchain_approved_networks':['TRON','BSC','SOLANA'],
            'onchain_owner_network_approval_recorded':True,
            'onchain_active_network_count':0,
            'onchain_selected_asset_count':0,
            'onchain_active_price_count':0,
            'onchain_receiving_address_count':0,
            'onchain_invoice_count':0,
            'onchain_observation_count':0,
            'onchain_provider_mode':'disabled',
            'onchain_provider_lifecycle':'draft',
            'onchain_checkout_enabled':False,
            'onchain_webhook_enabled':False,
            'onchain_recurring_enabled':False,
            'onchain_refunds_enabled':False,
            'onchain_automatic_entitlement_prepared':True,
            'onchain_automatic_entitlement_enabled':False,
            'onchain_owner_decision_integrity':'8/8 healthy',
            'onchain_integrity':'11/11 healthy',
            'data_integrity':'45/45 healthy',
            'launch_control_integrity':'6/6 healthy',
            'onchain_sandbox_scenario_count':29,
            'onchain_payment_activation_allowed':False,
            'onchain_concurrency_race_confirmed':True,
            'onchain_recurring_automation_paused':True,
            'onchain_false_supersession_invalidated':True,
            'onchain_authoritative_migration_version':'20260805095547',
            'onchain_authoritative_migration_source_commit':'2cc1e4eaee419c69533139eb6e615865aa9ea2d1',
            'onchain_payment_manifest':'docs/release-manifests/crypto-lab-v79-onchain-payments.json',
            'onchain_owner_decision_manifest':'docs/release-manifests/crypto-lab-v79-owner-network-decision.json',
            'onchain_sandbox_manifest':'docs/release-manifests/crypto-lab-v79-payment-sandbox-matrix.json'
          })
          data['payment_activation_allowed']=False
          data['publication_allowed']=False
          data['stable_root_v78_sha']='4a278c891d37b3760ec1ac988690ea9ad587b24e'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'CRYPTO LAB Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v79-final-authority-manifest-sync.yml
          git add docs/release-manifests/crypto-lab-v79-7930.json
          git commit -m 'Bind final owner-approved on-chain authority evidence'
          git push
